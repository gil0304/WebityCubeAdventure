/* ==== js/core/physics.js ==== */
/* Webity physics — rigidbody integration, capsule/sphere vs OBB/sphere/capsule solving,
   triggers, collision events, raycasts, kinematic platform carrying */
"use strict";

const WPhysics = (() => {

  /* ---------- world-space shape construction ---------- */
  function shapeFor(collider) {
    const t = collider.transform;
    const m = t.worldMatrix;
    const rot = t.rotation;
    const scale = t.lossyScale;
    const tn = collider.typeName;
    const center = m.mulPoint(Vector3.from(collider.center || Vector3.zero));
    if (tn === "BoxCollider") {
      const size = Vector3.from(collider.size || Vector3.one);
      const half = new Vector3(
        Math.abs(size.x * scale.x) / 2,
        Math.abs(size.y * scale.y) / 2,
        Math.abs(size.z * scale.z) / 2
      );
      return {
        kind: "box", center, half, rot,
        ax: rot.mulV(Vector3.right), ay: rot.mulV(Vector3.up), az: rot.mulV(Vector3.forward),
        collider,
      };
    }
    if (tn === "SphereCollider") {
      const r = collider.radius * Math.max(Math.abs(scale.x), Math.abs(scale.y), Math.abs(scale.z));
      return { kind: "sphere", center, radius: r, collider };
    }
    if (tn === "CapsuleCollider") {
      const r = collider.radius * Math.max(Math.abs(scale.x), Math.abs(scale.z));
      const h = Math.max(collider.height * Math.abs(scale.y), r * 2);
      const half = Math.max(0, h / 2 - r);
      const up = rot.mulV(Vector3.up);
      return {
        kind: "capsule", center, radius: r,
        p0: center.sub(up.mul(half)), p1: center.add(up.mul(half)),
        collider,
      };
    }
    return null;
  }

  /* ---------- primitive distance helpers ---------- */
  function toBoxLocal(shape, p) {
    const d = p.sub(shape.center);
    return new Vector3(Vector3.Dot(d, shape.ax), Vector3.Dot(d, shape.ay), Vector3.Dot(d, shape.az));
  }
  function fromBoxLocalDir(shape, v) {
    return shape.ax.mul(v.x).add(shape.ay.mul(v.y)).add(shape.az.mul(v.z));
  }
  function clampToBox(l, h) {
    return new Vector3(
      Mathf.Clamp(l.x, -h.x, h.x),
      Mathf.Clamp(l.y, -h.y, h.y),
      Mathf.Clamp(l.z, -h.z, h.z)
    );
  }
  function sqrDistPointBoxLocal(l, h) {
    let d = 0;
    for (const k of ["x", "y", "z"]) {
      const e = Math.abs(l[k]) - h[k];
      if (e > 0) d += e * e;
    }
    return d;
  }
  /* closest point on segment (a..b) to box via ternary search (convex along segment) */
  function closestTOnSegmentToBox(aL, bL, h) {
    let lo = 0, hi = 1;
    const f = (t) => sqrDistPointBoxLocal(Vector3.Lerp(aL, bL, t), h);
    for (let i = 0; i < 28; i++) {
      const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
      if (f(m1) < f(m2)) hi = m2; else lo = m1;
    }
    return (lo + hi) / 2;
  }
  function closestPtSegmentSegment(p1, q1, p2, q2) {
    const d1 = q1.sub(p1), d2 = q2.sub(p2), r = p1.sub(p2);
    const a = d1.sqrMagnitude, e = d2.sqrMagnitude, f = Vector3.Dot(d2, r);
    let s, t;
    if (a <= 1e-10 && e <= 1e-10) { s = 0; t = 0; }
    else if (a <= 1e-10) { s = 0; t = Mathf.Clamp01(f / e); }
    else {
      const c = Vector3.Dot(d1, r);
      if (e <= 1e-10) { t = 0; s = Mathf.Clamp01(-c / a); }
      else {
        const b = Vector3.Dot(d1, d2), denom = a * e - b * b;
        s = denom > 1e-10 ? Mathf.Clamp01((b * f - c * e) / denom) : 0;
        t = (b * s + f) / e;
        if (t < 0) { t = 0; s = Mathf.Clamp01(-c / a); }
        else if (t > 1) { t = 1; s = Mathf.Clamp01((b - c) / a); }
      }
    }
    return { c1: p1.add(d1.mul(s)), c2: p2.add(d2.mul(t)) };
  }

  /* Generic contact: returns {normal (push dir for shape A), depth, point} or null.
     A is the dynamic shape (sphere or capsule), B is any shape. */
  function contact(A, B) {
    if (A.kind === "sphere") return contactSphere(A.center, A.radius, B);
    if (A.kind === "capsule") return contactCapsule(A, B);
    if (A.kind === "box") return contactSphere(A.center, Math.min(A.half.x, A.half.y, A.half.z), B); // approx
    return null;
  }
  function contactSphere(c, r, B) {
    if (B.kind === "sphere") {
      const d = c.sub(B.center), dist = d.magnitude;
      if (dist >= r + B.radius) return null;
      const n = dist > 1e-7 ? d.div(dist) : Vector3.up;
      return { normal: n, depth: r + B.radius - dist, point: B.center.add(n.mul(B.radius)) };
    }
    if (B.kind === "capsule") {
      const cp = closestPtSegmentSegment(c, c, B.p0, B.p1);
      const d = c.sub(cp.c2), dist = d.magnitude;
      if (dist >= r + B.radius) return null;
      const n = dist > 1e-7 ? d.div(dist) : Vector3.up;
      return { normal: n, depth: r + B.radius - dist, point: cp.c2.add(n.mul(B.radius)) };
    }
    if (B.kind === "box") {
      const l = toBoxLocal(B, c);
      const q = clampToBox(l, B.half);
      const diff = l.sub(q);
      const dist2 = diff.sqrMagnitude;
      if (dist2 > 1e-12) {
        const dist = Math.sqrt(dist2);
        if (dist >= r) return null;
        const n = fromBoxLocalDir(B, diff.div(dist));
        return { normal: n, depth: r - dist, point: B.center.add(fromBoxLocalDir(B, q)) };
      }
      // center inside box: push out along min-penetration face
      let best = Infinity, nL = new Vector3(0, 1, 0);
      for (const k of ["x", "y", "z"]) {
        const pen = B.half[k] - Math.abs(l[k]);
        if (pen < best) {
          best = pen;
          nL = new Vector3(0, 0, 0);
          nL[k] = l[k] >= 0 ? 1 : -1;
        }
      }
      return { normal: fromBoxLocalDir(B, nL), depth: best + r, point: c.clone() };
    }
    return null;
  }
  function contactCapsule(A, B) {
    if (B.kind === "box") {
      const aL = toBoxLocal(B, A.p0), bL = toBoxLocal(B, A.p1);
      const t = closestTOnSegmentToBox(aL, bL, B.half);
      const segPt = Vector3.Lerp(A.p0, A.p1, t);
      return contactSphere(segPt, A.radius, B);
    }
    if (B.kind === "sphere") {
      const cp = closestPtSegmentSegment(A.p0, A.p1, B.center, B.center);
      return contactSphere(cp.c1, A.radius, B);
    }
    if (B.kind === "capsule") {
      const cp = closestPtSegmentSegment(A.p0, A.p1, B.p0, B.p1);
      const d = cp.c1.sub(cp.c2), dist = d.magnitude;
      if (dist >= A.radius + B.radius) return null;
      const n = dist > 1e-7 ? d.div(dist) : Vector3.up;
      return { normal: n, depth: A.radius + B.radius - dist, point: cp.c2.add(n.mul(B.radius)) };
    }
    return null;
  }
  function overlaps(A, B) { return contact(A, B) !== null || contact(B, A) !== null; }

  /* ---------- ray casts ---------- */
  function rayVsShape(origin, dir, maxDist, shape) {
    if (shape.kind === "sphere" || shape.kind === "capsule") {
      const spheres = shape.kind === "sphere"
        ? [{ c: shape.center, r: shape.radius }]
        : [{ c: shape.p0, r: shape.radius }, { c: shape.p1, r: shape.radius },
           { c: shape.p0.add(shape.p1).mul(0.5), r: shape.radius }];
      let best = null;
      for (const s of spheres) {
        const oc = origin.sub(s.c);
        const b = Vector3.Dot(oc, dir);
        const c = oc.sqrMagnitude - s.r * s.r;
        const disc = b * b - c;
        if (disc < 0) continue;
        const t = -b - Math.sqrt(disc);
        if (t < 0 || t > maxDist) continue;
        if (!best || t < best.distance) {
          const p = origin.add(dir.mul(t));
          best = { distance: t, point: p, normal: p.sub(s.c).normalized };
        }
      }
      return best;
    }
    if (shape.kind === "box") {
      const oL = toBoxLocal(shape, origin);
      const dL = new Vector3(Vector3.Dot(dir, shape.ax), Vector3.Dot(dir, shape.ay), Vector3.Dot(dir, shape.az));
      let tmin = 0, tmax = maxDist;
      let nAxis = "x", nSign = 1;
      for (const k of ["x", "y", "z"]) {
        if (Math.abs(dL[k]) < 1e-9) {
          if (Math.abs(oL[k]) > shape.half[k]) return null;
        } else {
          let t1 = (-shape.half[k] - oL[k]) / dL[k];
          let t2 = (shape.half[k] - oL[k]) / dL[k];
          let sign = -1;
          if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; sign = 1; }
          if (t1 > tmin) { tmin = t1; nAxis = k; nSign = sign; }
          tmax = Math.min(tmax, t2);
          if (tmin > tmax) return null;
        }
      }
      if (tmin <= 0 || tmin > maxDist) return null;
      const nL = new Vector3(0, 0, 0); nL[nAxis] = nSign;
      return { distance: tmin, point: origin.add(dir.mul(tmin)), normal: fromBoxLocalDir(shape, nL) };
    }
    return null;
  }

  /* ---------- collider collection ---------- */
  function collectColliders(scene) {
    const solids = [], triggers = [];
    for (const go of scene.iterate()) {
      if (!go.activeInHierarchy) continue;
      for (const c of go.components) {
        if (c.__destroyed || !c.enabled) continue;
        const tn = c.typeName;
        if (tn !== "BoxCollider" && tn !== "SphereCollider" && tn !== "CapsuleCollider") continue;
        const s = shapeFor(c);
        if (!s) continue;
        s.gameObject = go;
        s.rigidbody = go.GetComponentInParent ? go.GetComponentInParent("Rigidbody") : go.GetComponent("Rigidbody");
        (c.isTrigger ? triggers : solids).push(s);
      }
    }
    return { solids, triggers };
  }

  /* ---------- main step ---------- */
  // persistent maps: kinematic collider movement deltas, trigger/collision pair states
  const kinematicLastPos = new Map(); // gameObject.id -> {pos, rotY}
  let triggerPairs = new Map();       // "bodyGoId:colliderCompId" -> {a, b}
  let collisionPairs = new Map();
  let compIdCounter = 1;
  function compId(c) { if (!c.__physId) c.__physId = compIdCounter++; return c.__physId; }

  function resetState() {
    kinematicLastPos.clear();
    triggerPairs = new Map();
    collisionPairs = new Map();
  }

  function step(scene, dt, events) {
    const { solids, triggers } = collectColliders(scene);
    const gravity = scene.settings.gravity;

    // dynamic bodies: non-kinematic rigidbodies that own a (non-trigger) collider
    const bodies = [];
    const kinematics = new Map(); // goId -> delta of kinematic collider owners
    for (const go of scene.iterate()) {
      if (!go.activeInHierarchy) continue;
      const rb = go.GetComponent("Rigidbody");
      if (!rb || rb.__destroyed || !rb.enabled) continue;
      if (rb.isKinematic) {
        // apply MovePosition/MoveRotation
        if (rb._movePos) { go.transform.position = rb._movePos; rb._movePos = null; }
        if (rb._moveRot) { go.transform.rotation = rb._moveRot; rb._moveRot = null; }
        const cur = go.transform.position;
        const last = kinematicLastPos.get(go.id);
        kinematics.set(go.id, {
          delta: last ? cur.sub(last.pos) : new Vector3(),
          rotDeltaY: last ? deltaYaw(last.rot, go.transform.rotation) : 0,
          pos: cur,
        });
        kinematicLastPos.set(go.id, { pos: cur.clone(), rot: go.transform.rotation });
        continue;
      }
      bodies.push({ go, rb });
    }

    for (const body of bodies) {
      const { go, rb } = body;
      // integrate velocity
      let v = rb.velocity;
      if (rb.useGravity) v = v.add(gravity.mul(dt));
      if (rb._accumForce.sqrMagnitude > 0) {
        v = v.add(rb._accumForce.mul(dt / Math.max(rb.mass, 0.001)));
        rb._accumForce = new Vector3();
      }
      if (rb.drag > 0) v = v.mul(1 / (1 + rb.drag * dt));
      rb.velocity = v;
      // integrate position
      go.transform.position = go.transform.position.add(v.mul(dt));

      // resolve against solids
      const prevGroundCollider = rb._groundCollider;
      rb._grounded = false;
      rb._groundCollider = null;
      rb._groundNormal = Vector3.up;
      const myColliders = go.GetComponents("Collider");
      const newContacts = new Map(); // otherCompId -> contact info
      for (let iter = 0; iter < 3; iter++) {
        let any = false;
        for (const myCol of myColliders) {
          if (myCol.isTrigger) continue;
          const myShape = shapeFor(myCol);
          myShape.gameObject = go;
          for (const other of solids) {
            if (other.gameObject === go) continue;
            if (other.gameObject.transform.IsChildOf(go.transform)) continue;
            const ct = contact(myShape, other);
            if (!ct) continue;
            any = true;
            // positional correction
            go.transform.position = go.transform.position.add(ct.normal.mul(ct.depth));
            // velocity correction (no restitution)
            const vn = Vector3.Dot(rb.velocity, ct.normal);
            if (vn < 0) rb.velocity = rb.velocity.sub(ct.normal.mul(vn));
            if (ct.normal.y > 0.55) {
              rb._grounded = true;
              rb._groundCollider = other.collider;
              rb._groundNormal = ct.normal;
            }
            newContacts.set(compId(other.collider), {
              other, point: ct.point, normal: ct.normal.neg(),
            });
            // refresh my shape after moving
            const ms = shapeFor(myCol); ms.gameObject = go;
            Object.assign(myShape, ms);
          }
        }
        if (!any) break;
      }

      // moving platform carry
      if (rb._grounded && rb._groundCollider) {
        const ownerGo = rb._groundCollider.gameObject;
        const kin = kinematics.get(ownerGo.id) || (ownerGo.transform.parent && kinematics.get(ownerGo.transform.parent.gameObject.id));
        if (kin) {
          if (kin.delta.sqrMagnitude > 0) go.transform.position = go.transform.position.add(kin.delta);
          if (Math.abs(kin.rotDeltaY) > 1e-6) {
            const pivot = kin.pos;
            const q = Quaternion.AngleAxis(kin.rotDeltaY, Vector3.up);
            const d = go.transform.position.sub(pivot);
            go.transform.position = pivot.add(q.mulV(d));
          }
        }
      } else if (prevGroundCollider) {
        // just left ground: inherit platform velocity so jumps off moving platforms feel right
        const ownerGo = prevGroundCollider.gameObject;
        if (ownerGo && !ownerGo.__destroyed) {
          const kin = kinematics.get(ownerGo.id);
          if (kin && kin.delta.sqrMagnitude > 0 && dt > 0) {
            const pv = kin.delta.div(dt);
            rb.velocity = rb.velocity.add(new Vector3(pv.x * 0.9, Math.max(0, pv.y * 0.5), pv.z * 0.9));
          }
        }
      }

      // collision events
      const bodyKey = go.id;
      for (const [otherId, info] of newContacts) {
        const key = bodyKey + ":" + otherId;
        const collision = {
          gameObject: info.other.gameObject,
          collider: info.other.collider,
          transform: info.other.gameObject.transform,
          contacts: new CSList([{ point: info.point, normal: info.normal }]),
          relativeVelocity: rb.velocity.clone(),
        };
        const selfCollision = {
          gameObject: go, collider: myColliders[0] || null, transform: go.transform,
          contacts: new CSList([{ point: info.point, normal: info.normal.neg() }]),
          relativeVelocity: rb.velocity.clone(),
        };
        if (!collisionPairs.has(key)) {
          events.push({ type: "CollisionEnter", target: go, arg: collision });
          events.push({ type: "CollisionEnter", target: info.other.gameObject, arg: selfCollision });
        } else {
          events.push({ type: "CollisionStay", target: go, arg: collision });
          events.push({ type: "CollisionStay", target: info.other.gameObject, arg: selfCollision });
        }
        collisionPairs.set(key, { go, other: info.other.gameObject, frame: true });
      }
    }

    // collision exits
    for (const [key, pair] of [...collisionPairs]) {
      if (!pair.frame) {
        collisionPairs.delete(key);
        if (!pair.go.__destroyed && !pair.other.__destroyed) {
          events.push({ type: "CollisionExit", target: pair.go, arg: { gameObject: pair.other, transform: pair.other.transform, contacts: new CSList([]) } });
          events.push({ type: "CollisionExit", target: pair.other, arg: { gameObject: pair.go, transform: pair.go.transform, contacts: new CSList([]) } });
        }
      } else pair.frame = false;
    }

    // ---- triggers: every rigidbody (incl. kinematic) with any collider vs all triggers ----
    const allBodies = [];
    for (const go of scene.iterate()) {
      if (!go.activeInHierarchy) continue;
      const rb = go.GetComponent("Rigidbody");
      if (!rb || rb.__destroyed || !rb.enabled) continue;
      const cols = go.GetComponents("Collider").filter((c) => c.enabled);
      if (cols.length) allBodies.push({ go, cols });
    }
    for (const { go, cols } of allBodies) {
      for (const trig of triggers) {
        if (trig.gameObject === go) continue;
        if (trig.gameObject.transform.IsChildOf(go.transform)) continue;
        let hit = false;
        for (const myCol of cols) {
          const myShape = shapeFor(myCol);
          if (contact(myShape, trig) || contact(trig, myShape)) { hit = true; break; }
        }
        const key = go.id + ":" + compId(trig.collider);
        if (hit) {
          const myCollider = cols[0];
          if (!triggerPairs.has(key)) {
            events.push({ type: "TriggerEnter", target: trig.gameObject, arg: myCollider });
            events.push({ type: "TriggerEnter", target: go, arg: trig.collider });
          } else {
            events.push({ type: "TriggerStay", target: trig.gameObject, arg: myCollider });
            events.push({ type: "TriggerStay", target: go, arg: trig.collider });
          }
          triggerPairs.set(key, { go, trigGo: trig.gameObject, trigCol: trig.collider, myCol: cols[0], frame: true });
        }
      }
    }
    for (const [key, pair] of [...triggerPairs]) {
      if (!pair.frame) {
        triggerPairs.delete(key);
        if (!pair.trigGo.__destroyed && !pair.go.__destroyed) {
          events.push({ type: "TriggerExit", target: pair.trigGo, arg: pair.myCol });
          events.push({ type: "TriggerExit", target: pair.go, arg: pair.trigCol });
        }
      } else pair.frame = false;
    }
  }

  function deltaYaw(qa, qb) {
    const a = qa.eulerAngles.y, b = qb.eulerAngles.y;
    return Mathf.DeltaAngle(a, b);
  }

  function layerMatch(go, mask) {
    if (mask === undefined || mask === null || mask === -1 || mask === 0) return true;
    return (mask & (1 << go.layer)) !== 0;
  }

  function raycast(scene, origin, dir, maxDist = Infinity, mask = -1, includeTriggers = false) {
    dir = dir.normalized;
    const { solids, triggers } = collectColliders(scene);
    const list = includeTriggers ? solids.concat(triggers) : solids;
    let best = null;
    for (const s of list) {
      if (!layerMatch(s.gameObject, mask)) continue;
      const h = rayVsShape(origin, dir, maxDist, s);
      if (h && (!best || h.distance < best.distance)) {
        best = h;
        best.collider = s.collider;
        best.gameObject = s.gameObject;
        best.transform = s.gameObject.transform;
      }
    }
    return best;
  }

  function checkSphere(scene, center, radius, mask = -1) {
    const { solids } = collectColliders(scene);
    const probe = { kind: "sphere", center, radius };
    for (const s of solids) {
      if (!layerMatch(s.gameObject, mask)) continue;
      if (contact(probe, s)) return true;
    }
    return false;
  }

  function overlapSphere(scene, center, radius, mask = -1) {
    const { solids, triggers } = collectColliders(scene);
    const probe = { kind: "sphere", center, radius };
    const out = [];
    for (const s of solids.concat(triggers)) {
      if (!layerMatch(s.gameObject, mask)) continue;
      if (contact(probe, s)) out.push(s.collider);
    }
    return out;
  }

  return { step, resetState, raycast, checkSphere, overlapSphere, shapeFor, collectColliders };
})();


/* ==== js/core/particles.js ==== */
/* Webity particles — CPU simulation for ParticleSystem components */
"use strict";

const WParticles = (() => {
  const MAX_PER_SYSTEM = 512;

  function ensureSim(comp) {
    if (!comp._sim) {
      comp._sim = {
        particles: [],
        emitAccum: 0,
        playing: comp._playing,
        burstCount: 0,
        burst(n) { this.burstCount += n; },
      };
      if (comp._pendingBurst) { comp._sim.burstCount += comp._pendingBurst; comp._pendingBurst = 0; }
    }
    return comp._sim;
  }

  function spawnOne(comp, sim, origin) {
    if (sim.particles.length >= MAX_PER_SYSTEM) return;
    let dir;
    if (comp.shape === "Cone") {
      dir = new Vector3((Math.random() - 0.5) * comp.spread, 1, (Math.random() - 0.5) * comp.spread).normalized;
      dir = comp.transform.rotation.mulV(dir);
    } else if (comp.shape === "Point") {
      dir = comp.transform.rotation.mulV(Vector3.up);
    } else {
      dir = WRandom.onUnitSphere;
    }
    const jitter = comp.shape === "Sphere" ? WRandom.insideUnitSphere.mul(comp.spread * 0.5) : new Vector3();
    sim.particles.push({
      pos: origin.add(jitter),
      vel: dir.mul(comp.startSpeed * (0.7 + Math.random() * 0.6)),
      life: 0,
      maxLife: comp.lifetime * (0.75 + Math.random() * 0.5),
    });
  }

  function update(scene, dt) {
    for (const comp of scene.findComponents("ParticleSystem", true)) {
      const sim = ensureSim(comp);
      const active = comp.isActiveAndEnabled;
      sim.playing = comp._playing && active;
      const origin = comp.transform.position;
      if (sim.playing && active) {
        sim.emitAccum += comp.emissionRate * dt;
        while (sim.emitAccum >= 1) { sim.emitAccum -= 1; spawnOne(comp, sim, origin); }
      }
      while (sim.burstCount > 0) { sim.burstCount--; if (active) spawnOne(comp, sim, origin); }
      const g = scene.settings.gravity.mul(comp.gravityModifier);
      for (let i = sim.particles.length - 1; i >= 0; i--) {
        const p = sim.particles[i];
        p.life += dt;
        if (p.life >= p.maxLife) { sim.particles.splice(i, 1); continue; }
        p.vel = p.vel.add(g.mul(dt)).mul(1 / (1 + 0.6 * dt));
        p.pos = p.pos.add(p.vel.mul(dt));
      }
    }
  }

  /* Build renderer batches. Returns array of {data, count, additive} */
  const CORNERS = [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]];
  function buildBatches(scene) {
    const batches = [];
    for (const comp of scene.findComponents("ParticleSystem", true)) {
      const sim = comp._sim;
      if (!sim || !sim.particles.length) continue;
      if (!comp.gameObject.activeInHierarchy) continue;
      const n = sim.particles.length;
      const data = new Float32Array(n * 4 * 10);
      const sc = Color.from(comp.startColor), ec = Color.from(comp.endColor);
      let o = 0;
      for (const p of sim.particles) {
        const t = p.life / p.maxLife;
        const r = sc.r + (ec.r - sc.r) * t;
        const g = sc.g + (ec.g - sc.g) * t;
        const b = sc.b + (ec.b - sc.b) * t;
        const a = sc.a + (ec.a - sc.a) * t;
        const size = comp.startSize + (comp.endSize - comp.startSize) * t;
        for (const [cx, cy] of CORNERS) {
          data[o++] = p.pos.x; data[o++] = p.pos.y; data[o++] = p.pos.z;
          data[o++] = cx; data[o++] = cy;
          data[o++] = r; data[o++] = g; data[o++] = b; data[o++] = a;
          data[o++] = size;
        }
      }
      batches.push({ data, count: n, additive: !!comp.additive });
    }
    return batches;
  }

  function reset(scene) {
    if (!scene) return;
    for (const comp of scene.findComponents("ParticleSystem", true)) {
      comp._sim = null;
    }
  }

  return { update, buildBatches, reset };
})();


/* ==== js/core/uiRuntime.js ==== */
/* Webity UI runtime — renders Canvas/Text/Image/Panel/Button components as DOM overlay */
"use strict";

const WUI = (() => {
  let rootEl = null;
  let elMap = new Map();   // component -> DOM element
  let lastSignature = "";
  let buttonHandler = null;
  const REF_W = 960, REF_H = 540;

  function mount(el) { rootEl = el; clear(); }
  function setButtonHandler(fn) { buttonHandler = fn; }
  function clear() {
    if (rootEl) rootEl.innerHTML = "";
    elMap = new Map();
    lastSignature = "";
  }

  function anchorCSS(anchor) {
    // returns {left, top, tx, ty} percentages and translate percents
    switch (anchor) {
      case "TopLeft": return { l: 0, t: 0, tx: 0, ty: 0 };
      case "Top": return { l: 50, t: 0, tx: -50, ty: 0 };
      case "TopRight": return { l: 100, t: 0, tx: -100, ty: 0 };
      case "Left": return { l: 0, t: 50, tx: 0, ty: -50 };
      case "Center": return { l: 50, t: 50, tx: -50, ty: -50 };
      case "Right": return { l: 100, t: 50, tx: -100, ty: -50 };
      case "BottomLeft": return { l: 0, t: 100, tx: 0, ty: -100 };
      case "Bottom": return { l: 50, t: 100, tx: -50, ty: -100 };
      case "BottomRight": return { l: 100, t: 100, tx: -100, ty: -100 };
      default: return { l: 0, t: 0, tx: 0, ty: 0 };
    }
  }

  function collectUIComponents(scene) {
    const out = [];
    for (const go of scene.iterate()) {
      if (!go.activeInHierarchy) continue;
      // must be under a Canvas
      let p = go, hasCanvas = false;
      while (p) {
        if (p.GetComponent("Canvas")) { hasCanvas = true; break; }
        p = p.transform.parent ? p.transform.parent.gameObject : null;
      }
      if (!hasCanvas) continue;
      for (const c of go.components) {
        if (c.__destroyed || !c.enabled) continue;
        const tn = c.typeName;
        if (tn === "Text" || tn === "Image" || tn === "Panel" || tn === "Button") out.push(c);
      }
    }
    return out;
  }

  function signatureOf(comps) {
    return comps.map((c) => c.gameObject.id + c.typeName).join("|");
  }

  function render(scene, interactive) {
    if (!rootEl) return;
    const comps = collectUIComponents(scene);
    const sig = signatureOf(comps) + (interactive ? "#i" : "#e");
    const w = rootEl.clientWidth || 1, h = rootEl.clientHeight || 1;
    const scale = Math.min(w / REF_W, h / REF_H) || 1;

    if (sig !== lastSignature) {
      rootEl.innerHTML = "";
      elMap = new Map();
      for (const c of comps) {
        const el = document.createElement("div");
        el.className = "wui-elem wui-" + c.typeName.toLowerCase();
        if (c.typeName === "Button" && interactive) {
          el.classList.add("wui-interactive");
          el.addEventListener("pointerdown", (e) => {
            e.stopPropagation();
            if (buttonHandler) buttonHandler(c);
          });
        }
        rootEl.appendChild(el);
        elMap.set(c, el);
      }
      lastSignature = sig;
    }

    for (const c of comps) {
      const el = elMap.get(c);
      if (!el) continue;
      updateElement(c, el, scale);
    }
  }

  function place(el, c, scale, width, height) {
    const a = anchorCSS(c.anchor || "TopLeft");
    el.style.left = a.l + "%";
    el.style.top = a.t + "%";
    el.style.transform =
      `translate(${a.tx}%, ${a.ty}%) translate(${(c.offsetX || 0) * scale}px, ${(c.offsetY || 0) * scale}px)`;
    if (width !== undefined) el.style.width = width * scale + "px";
    if (height !== undefined) el.style.height = height * scale + "px";
  }

  function updateElement(c, el, scale) {
    const tn = c.typeName;
    if (tn === "Text") {
      el.textContent = c.content ?? "";
      el.style.fontSize = (c.fontSize || 16) * scale + "px";
      el.style.color = Color.from(c.color).toCSS();
      el.style.fontWeight = c.bold ? "700" : "400";
      el.style.textAlign = (c.align || "Left").toLowerCase();
      el.style.letterSpacing = (c.letterSpacing || 0) * scale + "px";
      el.classList.add("wui-text");
      place(el, c, scale);
    } else if (tn === "Image") {
      el.style.background = Color.from(c.color).toCSS();
      el.style.borderRadius = (c.cornerRadius || 0) * scale + "px";
      place(el, c, scale, c.width, c.height);
    } else if (tn === "Panel") {
      el.style.left = "0"; el.style.top = "0";
      el.style.right = "0"; el.style.bottom = "0";
      el.style.transform = "";
      el.style.background = Color.from(c.color).toCSS();
      el.style.backdropFilter = c.blur ? "blur(4px)" : "";
    } else if (tn === "Button") {
      el.textContent = c.label ?? "Button";
      el.className = "wui-elem wui-button" + (el.classList.contains("wui-interactive") ? " wui-interactive" : "");
      el.style.fontSize = (c.fontSize || 18) * scale + "px";
      el.style.color = Color.from(c.textColor).toCSS();
      el.style.background = Color.from(c.bgColor).toCSS();
      el.style.borderRadius = 6 * scale + "px";
      el.style.fontWeight = "600";
      el.style.letterSpacing = 2 * scale + "px";
      place(el, c, scale, c.width, c.height);
    }
  }

  return { mount, render, clear, setButtonHandler };
})();


/* ==== js/cs/lexer.js ==== */
/* Webity C# lexer */
"use strict";

class CSError extends Error {
  constructor(message, line, col, code = "CS0000") {
    super(message);
    this.line = line; this.col = col; this.code = code;
  }
}

const CS_KEYWORDS = new Set([
  "using", "namespace", "class", "struct", "enum", "interface",
  "public", "private", "protected", "internal", "static", "readonly", "const",
  "override", "virtual", "abstract", "sealed", "partial",
  "void", "var", "new", "return", "if", "else", "while", "for", "foreach", "in",
  "do", "switch", "case", "default", "break", "continue", "yield",
  "true", "false", "null", "this", "base", "is", "as", "out", "ref",
  "float", "int", "double", "bool", "string", "long", "short", "byte", "char", "object", "uint",
  "try", "catch", "finally", "throw",
]);

const CS_PUNCS = [
  "??=", "<<=", ">>=",
  "==", "!=", "<=", ">=", "&&", "||", "++", "--", "+=", "-=", "*=", "/=", "%=",
  "=>", "?.", "??", "<<", ">>", "&=", "|=", "^=",
  "+", "-", "*", "/", "%", "=", "<", ">", "!", "&", "|", "^", "~", "?", ":",
  ".", ",", ";", "(", ")", "{", "}", "[", "]",
];

function csLex(source) {
  const tokens = [];
  let i = 0, line = 1, col = 1;
  const n = source.length;

  function err(msg, code) { throw new CSError(msg, line, col, code); }
  function push(t, v, l = line, c = col) { tokens.push({ t, v, line: l, col: c }); }
  function advance(count = 1) {
    for (let k = 0; k < count; k++) {
      if (source[i] === "\n") { line++; col = 1; } else col++;
      i++;
    }
  }

  function readString(quote, allowEscape = true) {
    // assumes source[i] is the opening quote
    const startLine = line, startCol = col;
    advance();
    let out = "";
    while (i < n) {
      const ch = source[i];
      if (ch === "\n") err("Newline in constant", "CS1010");
      if (ch === quote) { advance(); return out; }
      if (allowEscape && ch === "\\") {
        advance();
        const e = source[i];
        const map = { n: "\n", t: "\t", r: "\r", "0": "\0", "\\": "\\", '"': '"', "'": "'" };
        if (e === "u") {
          const hex = source.slice(i + 1, i + 5);
          out += String.fromCharCode(parseInt(hex, 16) || 0);
          advance(5);
        } else {
          out += map[e] !== undefined ? map[e] : e;
          advance();
        }
      } else { out += ch; advance(); }
    }
    line = startLine; col = startCol;
    err("Unterminated string literal", "CS1010");
  }

  function readInterpolated() {
    // at '$'; next char is '"'
    const startLine = line, startCol = col;
    advance(); // $
    advance(); // "
    const parts = [];
    let text = "";
    while (i < n) {
      const ch = source[i];
      if (ch === '"') { advance(); if (text) parts.push({ type: "text", value: text }); push("istr", parts, startLine, startCol); return; }
      if (ch === "\n") err("Newline in constant", "CS1010");
      if (ch === "{" && source[i + 1] === "{") { text += "{"; advance(2); continue; }
      if (ch === "}" && source[i + 1] === "}") { text += "}"; advance(2); continue; }
      if (ch === "\\") {
        advance();
        const e = source[i];
        const map = { n: "\n", t: "\t", r: "\r", "\\": "\\", '"': '"' };
        text += map[e] !== undefined ? map[e] : e;
        advance();
        continue;
      }
      if (ch === "{") {
        if (text) { parts.push({ type: "text", value: text }); text = ""; }
        advance();
        const exprStartLine = line, exprStartCol = col;
        let depth = 0, src = "", fmt = null;
        while (i < n) {
          const c2 = source[i];
          if (c2 === "(" || c2 === "[") depth++;
          if (c2 === ")" || c2 === "]") depth--;
          if (c2 === "}" && depth <= 0) { advance(); break; }
          if (c2 === ":" && depth <= 0 && fmt === null) { fmt = ""; advance(); continue; }
          if (fmt !== null) fmt += c2; else src += c2;
          advance();
          if (i >= n) err("Unterminated interpolation", "CS1010");
        }
        parts.push({ type: "expr", src, fmt, line: exprStartLine, col: exprStartCol });
        continue;
      }
      text += ch; advance();
    }
    line = startLine; col = startCol;
    err("Unterminated string literal", "CS1010");
  }

  while (i < n) {
    const ch = source[i];
    // whitespace
    if (ch === " " || ch === "\t" || ch === "\r" || ch === "\n") { advance(); continue; }
    // comments
    if (ch === "/" && source[i + 1] === "/") { while (i < n && source[i] !== "\n") advance(); continue; }
    if (ch === "/" && source[i + 1] === "*") {
      advance(2);
      while (i < n && !(source[i] === "*" && source[i + 1] === "/")) advance();
      if (i >= n) err("Unterminated comment", "CS1035");
      advance(2);
      continue;
    }
    // strings
    if (ch === '"') { const l = line, c = col; push("str", readString('"'), l, c); continue; }
    if (ch === "'") {
      const l = line, c = col;
      const s = readString("'");
      if (s.length !== 1) { line = l; col = c; err("Too many characters in character literal", "CS1012"); }
      push("char", s, l, c);
      continue;
    }
    if (ch === "$" && source[i + 1] === '"') { readInterpolated(); continue; }
    if (ch === "@" && source[i + 1] === '"') {
      const l = line, c = col;
      advance();
      push("str", readString('"', false), l, c);
      continue;
    }
    // numbers
    if (/[0-9]/.test(ch) || (ch === "." && /[0-9]/.test(source[i + 1] || ""))) {
      const l = line, c = col;
      let numStr = "";
      if (ch === "0" && (source[i + 1] === "x" || source[i + 1] === "X")) {
        advance(2);
        while (i < n && /[0-9a-fA-F]/.test(source[i])) { numStr += source[i]; advance(); }
        push("num", parseInt(numStr, 16), l, c);
        continue;
      }
      let seenDot = false, seenExp = false;
      while (i < n) {
        const d = source[i];
        if (/[0-9]/.test(d)) { numStr += d; advance(); }
        else if (d === "." && !seenDot && !seenExp && /[0-9]/.test(source[i + 1] || "")) { seenDot = true; numStr += d; advance(); }
        else if ((d === "e" || d === "E") && !seenExp && /[0-9+-]/.test(source[i + 1] || "")) { seenExp = true; numStr += d; advance(); if (source[i] === "+" || source[i] === "-") { numStr += source[i]; advance(); } }
        else break;
      }
      if (i < n && /[fFdDmM]/.test(source[i])) advance(); // type suffix
      if (i < n && /[lLuU]/.test(source[i])) advance();
      push("num", parseFloat(numStr), l, c);
      continue;
    }
    // identifiers / keywords
    if (/[A-Za-z_]/.test(ch)) {
      const l = line, c = col;
      let id = "";
      while (i < n && /[A-Za-z0-9_]/.test(source[i])) { id += source[i]; advance(); }
      push(CS_KEYWORDS.has(id) ? "kw" : "id", id, l, c);
      continue;
    }
    // attributes / punctuation
    let matched = false;
    for (const p of CS_PUNCS) {
      if (source.startsWith(p, i)) {
        push("punc", p);
        advance(p.length);
        matched = true;
        break;
      }
    }
    if (matched) continue;
    err(`Unexpected character '${ch}'`, "CS1056");
  }
  push("eof", null);
  return tokens;
}


/* ==== js/cs/parser.js ==== */
/* Webity C# parser — recursive descent producing a compact AST */
"use strict";

const CS_PRIMITIVES = new Set(["float", "int", "double", "bool", "string", "long", "short", "byte", "char", "object", "uint", "void", "var"]);
const CS_MODIFIERS = new Set(["public", "private", "protected", "internal", "static", "readonly", "const", "override", "virtual", "abstract", "sealed", "partial"]);

class CSParser {
  constructor(tokens) {
    this.toks = tokens;
    this.pos = 0;
  }
  peek(k = 0) { return this.toks[Math.min(this.pos + k, this.toks.length - 1)]; }
  next() { return this.toks[this.pos++]; }
  at(t, v) { const tk = this.peek(); return tk.t === t && (v === undefined || tk.v === v); }
  atPunc(v) { return this.at("punc", v); }
  atKw(v) { return this.at("kw", v); }
  eat(t, v) { if (this.at(t, v)) return this.next(); return null; }
  expect(t, v, msg, code) {
    if (this.at(t, v)) return this.next();
    const tk = this.peek();
    this.err(msg || `${v || t} expected`, code || "CS1002", tk);
  }
  err(msg, code, tk) {
    tk = tk || this.peek();
    throw new CSError(msg, tk.line, tk.col, code);
  }
  save() { return this.pos; }
  restore(p) { this.pos = p; }

  /* ============ program ============ */
  parseProgram() {
    const types = [];
    while (!this.at("eof")) {
      if (this.atKw("using")) { while (!this.atPunc(";") && !this.at("eof")) this.next(); this.expect("punc", ";", "; expected", "CS1002"); continue; }
      if (this.atKw("namespace")) {
        this.next();
        while (this.at("id") || this.atPunc(".")) this.next();
        this.expect("punc", "{", "{ expected", "CS1514");
        while (!this.atPunc("}") && !this.at("eof")) types.push(this.parseTypeDecl());
        this.expect("punc", "}", "} expected", "CS1513");
        continue;
      }
      types.push(this.parseTypeDecl());
    }
    return { kind: "Program", types };
  }

  parseAttributes() {
    const attrs = [];
    while (this.atPunc("[")) {
      const p = this.save();
      this.next();
      if (!this.at("id")) { this.restore(p); break; }
      while (!this.atPunc("]") && !this.at("eof")) {
        const name = this.expect("id", undefined, "Attribute name expected", "CS1001").v;
        let args = [];
        if (this.eat("punc", "(")) {
          if (!this.atPunc(")")) {
            do { args.push(this.parseExpression()); } while (this.eat("punc", ","));
          }
          this.expect("punc", ")", ") expected", "CS1026");
        }
        attrs.push({ name, args });
        if (!this.eat("punc", ",")) break;
      }
      this.expect("punc", "]", "] expected", "CS1003");
    }
    return attrs;
  }

  parseModifiers() {
    const mods = new Set();
    while (this.at("kw") && CS_MODIFIERS.has(this.peek().v)) mods.add(this.next().v);
    return mods;
  }

  parseTypeDecl() {
    const attrs = this.parseAttributes();
    const mods = this.parseModifiers();
    if (this.atKw("enum")) return this.parseEnum(mods, attrs);
    if (this.atKw("class") || this.atKw("struct") || this.atKw("interface")) return this.parseClass(mods, attrs);
    this.err("A class, enum, or using directive expected", "CS1022");
  }

  parseEnum(mods) {
    this.next();
    const name = this.expect("id", undefined, "Identifier expected", "CS1001").v;
    this.expect("punc", "{", "{ expected", "CS1514");
    const members = [];
    let autoVal = 0;
    while (!this.atPunc("}") && !this.at("eof")) {
      const mname = this.expect("id", undefined, "Identifier expected", "CS1001").v;
      let value = autoVal;
      if (this.eat("punc", "=")) {
        const neg = !!this.eat("punc", "-");
        const numTok = this.expect("num", undefined, "Constant expected", "CS0150");
        value = neg ? -numTok.v : numTok.v;
      }
      members.push({ name: mname, value });
      autoVal = value + 1;
      if (!this.eat("punc", ",")) break;
    }
    this.expect("punc", "}", "} expected", "CS1513");
    this.eat("punc", ";");
    return { kind: "Enum", name, members, mods: [...mods] };
  }

  parseClass(mods) {
    const keyword = this.next().v; // class/struct/interface
    const nameTok = this.expect("id", undefined, "Identifier expected", "CS1001");
    const name = nameTok.v;
    let base = null;
    if (this.eat("punc", ":")) {
      base = this.parseType().name;
      while (this.eat("punc", ",")) this.parseType(); // interfaces ignored
    }
    this.expect("punc", "{", "{ expected", "CS1514");
    const members = [];
    while (!this.atPunc("}") && !this.at("eof")) {
      members.push(this.parseMember(name));
    }
    this.expect("punc", "}", "} expected", "CS1513");
    this.eat("punc", ";");
    return { kind: "Class", name, base, members, mods: [...mods], keyword, line: nameTok.line };
  }

  parseMember(className) {
    const attrs = this.parseAttributes();
    const mods = this.parseModifiers();
    if (this.atKw("enum")) return this.parseEnum(mods);
    if (this.atKw("class")) return this.parseClass(mods);
    // constructor?
    if (this.at("id", className) && this.peek(1).t === "punc" && this.peek(1).v === "(") {
      const tok = this.next();
      return this.parseMethodRest({ name: "constructor", retType: null, mods, attrs, line: tok.line, isCtor: true });
    }
    const type = this.parseType();
    const nameTok = this.expect("id", undefined, "Identifier expected", "CS1001");
    const name = nameTok.v;
    if (this.atPunc("(")) {
      return this.parseMethodRest({ name, retType: type, mods, attrs, line: nameTok.line });
    }
    if (this.atPunc("{")) {
      // property
      return this.parseProperty({ name, type, mods, attrs, line: nameTok.line });
    }
    if (this.atPunc("=>")) {
      this.next();
      const expr = this.parseExpression();
      this.expect("punc", ";", "; expected", "CS1002");
      return { kind: "Property", name, type, mods: [...mods], attrs, getterExpr: expr, line: nameTok.line };
    }
    // field(s)
    const decls = [];
    let init = null;
    if (this.eat("punc", "=")) init = this.parseVarInit();
    decls.push({ name, init, line: nameTok.line });
    while (this.eat("punc", ",")) {
      const nt = this.expect("id", undefined, "Identifier expected", "CS1001");
      let ini = null;
      if (this.eat("punc", "=")) ini = this.parseVarInit();
      decls.push({ name: nt.v, init: ini, line: nt.line });
    }
    this.expect("punc", ";", "; expected", "CS1002");
    return { kind: "Field", type, decls, mods: [...mods], attrs, line: nameTok.line };
  }

  parseProperty({ name, type, mods, attrs, line }) {
    this.expect("punc", "{", "{ expected", "CS1514");
    let hasGet = false, hasSet = false, getterBody = null, setterBody = null;
    while (!this.atPunc("}") && !this.at("eof")) {
      this.parseModifiers(); // accessor modifiers e.g. private set
      const acc = this.expect("id", undefined, "get or set expected", "CS1014");
      if (acc.v !== "get" && acc.v !== "set") this.err("get or set expected", "CS1014", acc);
      if (this.eat("punc", ";")) {
        if (acc.v === "get") hasGet = true; else hasSet = true;
      } else if (this.atPunc("{")) {
        const body = this.parseBlock();
        if (acc.v === "get") { hasGet = true; getterBody = body; } else { hasSet = true; setterBody = body; }
      } else if (this.eat("punc", "=>")) {
        const expr = this.parseExpression();
        this.expect("punc", ";", "; expected", "CS1002");
        if (acc.v === "get") { hasGet = true; getterBody = { kind: "Block", stmts: [{ kind: "Return", expr }] }; }
        else { hasSet = true; setterBody = { kind: "Block", stmts: [{ kind: "ExprStmt", expr }] }; }
      } else this.err("; or { expected", "CS1002");
    }
    this.expect("punc", "}", "} expected", "CS1513");
    let init = null;
    if (this.eat("punc", "=")) { init = this.parseVarInit(); this.expect("punc", ";", "; expected", "CS1002"); }
    return { kind: "Property", name, type, mods: [...mods], attrs, hasGet, hasSet, getterBody, setterBody, init, line };
  }

  parseMethodRest({ name, retType, mods, attrs, line, isCtor }) {
    this.expect("punc", "(", "( expected", "CS1003");
    const params = [];
    if (!this.atPunc(")")) {
      do {
        this.eat("kw", "out"); this.eat("kw", "ref"); // param modifiers tolerated
        const ptype = this.parseType();
        const pn = this.expect("id", undefined, "Identifier expected", "CS1001").v;
        let def = null;
        if (this.eat("punc", "=")) def = this.parseExpression();
        params.push({ type: ptype, name: pn, default: def });
      } while (this.eat("punc", ","));
    }
    this.expect("punc", ")", ") expected", "CS1026");
    let body = null;
    if (this.eat("punc", "=>")) {
      const expr = this.parseExpression();
      this.expect("punc", ";", "; expected", "CS1002");
      body = { kind: "Block", stmts: [retType && retType.name !== "void" ? { kind: "Return", expr } : { kind: "ExprStmt", expr }] };
    } else if (this.atPunc("{")) {
      body = this.parseBlock();
    } else {
      this.expect("punc", ";", "; expected", "CS1002"); // abstract/extern — empty
      body = { kind: "Block", stmts: [] };
    }
    const isCoroutine = retType && (retType.name === "IEnumerator" || retType.name === "IEnumerator<>");
    return { kind: "Method", name, retType, params, body, mods: [...mods], attrs, line, isCtor: !!isCtor, isCoroutine };
  }

  /* ============ types ============ */
  parseType() {
    let name;
    const tk = this.peek();
    if (tk.t === "kw" && CS_PRIMITIVES.has(tk.v)) { name = this.next().v; }
    else if (tk.t === "id") {
      name = this.next().v;
      while (this.atPunc(".") && this.peek(1).t === "id") { this.next(); name = this.next().v; } // Namespace.Type → Type
    }
    else this.err("Type expected", "CS1031", tk);
    let args = null;
    if (this.atPunc("<") && this.looksLikeTypeArgs()) {
      this.next();
      args = [this.parseType()];
      while (this.eat("punc", ",")) args.push(this.parseType());
      this.expect("punc", ">", "> expected", "CS1003");
    }
    let arrayDims = 0;
    while (this.atPunc("[") && this.peek(1).t === "punc" && this.peek(1).v === "]") {
      this.next(); this.next(); arrayDims++;
    }
    this.eat("punc", "?"); // nullable — ignore
    return { name, args, arrayDims };
  }
  looksLikeTypeArgs() {
    // scan ahead from '<' for a plausible closing '>' followed by sane token
    let p = this.pos + 1, depth = 1;
    let guard = 0;
    while (p < this.toks.length && guard++ < 40) {
      const tk = this.toks[p];
      if (tk.t === "punc") {
        if (tk.v === "<") depth++;
        else if (tk.v === ">") { depth--; if (depth === 0) return true; }
        else if (tk.v === "[" || tk.v === "]" || tk.v === "," || tk.v === ".") { /* ok inside */ }
        else return false;
      } else if (tk.t !== "id" && !(tk.t === "kw" && CS_PRIMITIVES.has(tk.v))) return false;
      p++;
    }
    return false;
  }

  /* ============ statements ============ */
  parseBlock() {
    this.expect("punc", "{", "{ expected", "CS1514");
    const stmts = [];
    while (!this.atPunc("}") && !this.at("eof")) stmts.push(this.parseStatement());
    this.expect("punc", "}", "} expected", "CS1513");
    return { kind: "Block", stmts };
  }

  parseStatement() {
    const tk = this.peek();
    if (this.atPunc("{")) return this.parseBlock();
    if (this.atPunc(";")) { this.next(); return { kind: "Empty" }; }
    if (tk.t === "kw") {
      switch (tk.v) {
        case "if": {
          this.next();
          this.expect("punc", "(", "( expected", "CS1003");
          const cond = this.parseExpression();
          this.expect("punc", ")", ") expected", "CS1026");
          const then = this.parseStatement();
          let els = null;
          if (this.eat("kw", "else")) els = this.parseStatement();
          return { kind: "If", cond, then, else: els, line: tk.line };
        }
        case "while": {
          this.next();
          this.expect("punc", "(", "( expected", "CS1003");
          const cond = this.parseExpression();
          this.expect("punc", ")", ") expected", "CS1026");
          return { kind: "While", cond, body: this.parseStatement(), line: tk.line };
        }
        case "do": {
          this.next();
          const body = this.parseStatement();
          this.expect("kw", "while", "while expected", "CS1003");
          this.expect("punc", "(", "( expected", "CS1003");
          const cond = this.parseExpression();
          this.expect("punc", ")", ") expected", "CS1026");
          this.expect("punc", ";", "; expected", "CS1002");
          return { kind: "DoWhile", cond, body, line: tk.line };
        }
        case "for": {
          this.next();
          this.expect("punc", "(", "( expected", "CS1003");
          let init = null;
          if (!this.atPunc(";")) init = this.parseDeclOrExpr();
          this.expect("punc", ";", "; expected", "CS1002");
          let cond = null;
          if (!this.atPunc(";")) cond = this.parseExpression();
          this.expect("punc", ";", "; expected", "CS1002");
          let inc = null;
          if (!this.atPunc(")")) {
            inc = [this.parseExpression()];
            while (this.eat("punc", ",")) inc.push(this.parseExpression());
          }
          this.expect("punc", ")", ") expected", "CS1026");
          return { kind: "For", init, cond, inc, body: this.parseStatement(), line: tk.line };
        }
        case "foreach": {
          this.next();
          this.expect("punc", "(", "( expected", "CS1003");
          this.parseType();
          const vn = this.expect("id", undefined, "Identifier expected", "CS1001").v;
          this.expect("kw", "in", "in expected", "CS1003");
          const coll = this.parseExpression();
          this.expect("punc", ")", ") expected", "CS1026");
          return { kind: "Foreach", varName: vn, coll, body: this.parseStatement(), line: tk.line };
        }
        case "return": {
          this.next();
          let expr = null;
          if (!this.atPunc(";")) expr = this.parseExpression();
          this.expect("punc", ";", "; expected", "CS1002");
          return { kind: "Return", expr, line: tk.line };
        }
        case "break": this.next(); this.expect("punc", ";", "; expected", "CS1002"); return { kind: "Break" };
        case "continue": this.next(); this.expect("punc", ";", "; expected", "CS1002"); return { kind: "Continue" };
        case "yield": {
          this.next();
          if (this.eat("kw", "break")) { this.expect("punc", ";", "; expected", "CS1002"); return { kind: "YieldBreak" }; }
          this.expect("kw", "return", "return expected after yield", "CS1003");
          let expr = null;
          if (!this.atPunc(";")) expr = this.parseExpression();
          this.expect("punc", ";", "; expected", "CS1002");
          return { kind: "YieldReturn", expr, line: tk.line };
        }
        case "switch": {
          this.next();
          this.expect("punc", "(", "( expected", "CS1003");
          const expr = this.parseExpression();
          this.expect("punc", ")", ") expected", "CS1026");
          this.expect("punc", "{", "{ expected", "CS1514");
          const cases = [];
          while (!this.atPunc("}") && !this.at("eof")) {
            const labels = [];
            while (this.atKw("case") || this.atKw("default")) {
              if (this.eat("kw", "case")) {
                labels.push(this.parseExpression());
                this.expect("punc", ":", ": expected", "CS1003");
              } else {
                this.next();
                this.expect("punc", ":", ": expected", "CS1003");
                labels.push(null);
              }
            }
            const stmts = [];
            while (!this.atKw("case") && !this.atKw("default") && !this.atPunc("}") && !this.at("eof"))
              stmts.push(this.parseStatement());
            cases.push({ labels, stmts });
          }
          this.expect("punc", "}", "} expected", "CS1513");
          return { kind: "Switch", expr, cases, line: tk.line };
        }
        case "throw": {
          this.next();
          let expr = null;
          if (!this.atPunc(";")) expr = this.parseExpression();
          this.expect("punc", ";", "; expected", "CS1002");
          return { kind: "Throw", expr, line: tk.line };
        }
        case "try": {
          this.next();
          const block = this.parseBlock();
          let catchVar = null, catchBlock = null, finallyBlock = null;
          if (this.eat("kw", "catch")) {
            if (this.eat("punc", "(")) {
              this.parseType();
              if (this.at("id")) catchVar = this.next().v;
              this.expect("punc", ")", ") expected", "CS1026");
            }
            catchBlock = this.parseBlock();
          }
          if (this.eat("kw", "finally")) finallyBlock = this.parseBlock();
          return { kind: "Try", block, catchVar, catchBlock, finallyBlock, line: tk.line };
        }
      }
    }
    const st = this.parseDeclOrExpr();
    this.expect("punc", ";", "; expected", "CS1002");
    return st;
  }

  parseDeclOrExpr() {
    // speculative: type ident [= expr] (, ident [= expr])*
    const p = this.save();
    const tk = this.peek();
    if ((tk.t === "kw" && CS_PRIMITIVES.has(tk.v) && tk.v !== "void") || tk.t === "id") {
      try {
        const type = this.parseType();
        if (this.at("id")) {
          const nx = this.peek(1);
          if (nx.t === "punc" && (nx.v === "=" || nx.v === ";" || nx.v === ",")) {
            const decls = [];
            do {
              const nameTok = this.expect("id", undefined, "Identifier expected", "CS1001");
              let init = null;
              if (this.eat("punc", "=")) init = this.parseVarInit();
              decls.push({ name: nameTok.v, init });
            } while (this.eat("punc", ","));
            return { kind: "VarDecl", type, decls, line: tk.line };
          }
        }
      } catch (e) { /* fall through to expression */ }
      this.restore(p);
    }
    const expr = this.parseExpression();
    return { kind: "ExprStmt", expr, line: tk.line };
  }

  parseVarInit() {
    // supports array initializer  { a, b, c }
    if (this.atPunc("{")) {
      this.next();
      const items = [];
      if (!this.atPunc("}")) {
        do { items.push(this.parseVarInit()); } while (this.eat("punc", ","));
      }
      this.expect("punc", "}", "} expected", "CS1513");
      return { kind: "ArrayInit", items };
    }
    return this.parseExpression();
  }

  /* ============ expressions ============ */
  parseExpression() { return this.parseAssignment(); }

  parseAssignment() {
    // lambda detection: id => ...  |  (a, b) => ...
    if (this.at("id") && this.peek(1).t === "punc" && this.peek(1).v === "=>") {
      const param = this.next().v;
      this.next();
      const body = this.atPunc("{") ? this.parseBlock() : this.parseExpression();
      return { kind: "Lambda", params: [param], body };
    }
    if (this.atPunc("(")) {
      const p = this.save();
      let ok = true, params = [];
      this.next();
      if (this.atPunc(")")) { /* () => */ }
      else {
        while (true) {
          const save2 = this.save();
          // optional type then name
          if (this.at("id") || (this.at("kw") && CS_PRIMITIVES.has(this.peek().v))) {
            try { this.parseType(); } catch (e) { this.restore(save2); }
            if (!this.at("id")) this.restore(save2);
          }
          if (this.at("id")) params.push(this.next().v);
          else { ok = false; break; }
          if (this.eat("punc", ",")) continue;
          break;
        }
      }
      if (ok && this.atPunc(")") && this.peek(1).t === "punc" && this.peek(1).v === "=>") {
        this.next(); this.next();
        const body = this.atPunc("{") ? this.parseBlock() : this.parseExpression();
        return { kind: "Lambda", params, body };
      }
      this.restore(p);
    }
    const left = this.parseTernary();
    const tk = this.peek();
    if (tk.t === "punc" && ["=", "+=", "-=", "*=", "/=", "%=", "??=", "|=", "&=", "^="].includes(tk.v)) {
      this.next();
      const right = this.parseAssignment();
      return { kind: "Assign", op: tk.v, target: left, value: right, line: tk.line };
    }
    return left;
  }

  parseTernary() {
    const cond = this.parseNullCoalesce();
    if (this.atPunc("?") && !this.atPunc("?.")) {
      this.next();
      const t = this.parseAssignment();
      this.expect("punc", ":", ": expected", "CS1003");
      const f = this.parseAssignment();
      return { kind: "Ternary", cond, then: t, else: f };
    }
    return cond;
  }
  parseNullCoalesce() {
    let l = this.parseOr();
    while (this.atPunc("??")) { this.next(); l = { kind: "Binary", op: "??", l, r: this.parseOr() }; }
    return l;
  }
  parseOr() {
    let l = this.parseAnd();
    while (this.atPunc("||")) { this.next(); l = { kind: "Binary", op: "||", l, r: this.parseAnd() }; }
    return l;
  }
  parseAnd() {
    let l = this.parseBitOr();
    while (this.atPunc("&&")) { this.next(); l = { kind: "Binary", op: "&&", l, r: this.parseBitOr() }; }
    return l;
  }
  parseBitOr() {
    let l = this.parseBitXor();
    while (this.atPunc("|")) { this.next(); l = { kind: "Binary", op: "|", l, r: this.parseBitXor() }; }
    return l;
  }
  parseBitXor() {
    let l = this.parseBitAnd();
    while (this.atPunc("^")) { this.next(); l = { kind: "Binary", op: "^", l, r: this.parseBitAnd() }; }
    return l;
  }
  parseBitAnd() {
    let l = this.parseEquality();
    while (this.atPunc("&")) { this.next(); l = { kind: "Binary", op: "&", l, r: this.parseEquality() }; }
    return l;
  }
  parseEquality() {
    let l = this.parseRelational();
    while (this.atPunc("==") || this.atPunc("!=")) {
      const op = this.next().v;
      l = { kind: "Binary", op, l, r: this.parseRelational() };
    }
    return l;
  }
  parseRelational() {
    let l = this.parseShift();
    while (true) {
      if (this.atPunc("<") || this.atPunc(">") || this.atPunc("<=") || this.atPunc(">=")) {
        // avoid treating generic call as relational: handled in postfix already
        const op = this.next().v;
        l = { kind: "Binary", op, l, r: this.parseShift() };
      } else if (this.atKw("is")) {
        this.next();
        const type = this.parseType();
        let name = null;
        if (this.at("id")) name = this.next().v;
        l = { kind: "Is", expr: l, type, name };
      } else if (this.atKw("as")) {
        this.next();
        const type = this.parseType();
        l = { kind: "As", expr: l, type };
      } else break;
    }
    return l;
  }
  parseShift() {
    let l = this.parseAdditive();
    while (this.atPunc("<<") || this.atPunc(">>")) {
      const op = this.next().v;
      l = { kind: "Binary", op, l, r: this.parseAdditive() };
    }
    return l;
  }
  parseAdditive() {
    let l = this.parseMultiplicative();
    while (this.atPunc("+") || this.atPunc("-")) {
      const op = this.next().v;
      l = { kind: "Binary", op, l, r: this.parseMultiplicative() };
    }
    return l;
  }
  parseMultiplicative() {
    let l = this.parseUnary();
    while (this.atPunc("*") || this.atPunc("/") || this.atPunc("%")) {
      const op = this.next().v;
      l = { kind: "Binary", op, l, r: this.parseUnary() };
    }
    return l;
  }
  parseUnary() {
    const tk = this.peek();
    if (this.atPunc("!")) { this.next(); return { kind: "Unary", op: "!", operand: this.parseUnary() }; }
    if (this.atPunc("-")) { this.next(); return { kind: "Unary", op: "-", operand: this.parseUnary() }; }
    if (this.atPunc("+")) { this.next(); return this.parseUnary(); }
    if (this.atPunc("~")) { this.next(); return { kind: "Unary", op: "~", operand: this.parseUnary() }; }
    if (this.atPunc("++") || this.atPunc("--")) {
      const op = this.next().v;
      return { kind: "Unary", op, operand: this.parseUnary(), prefix: true };
    }
    // cast: (primitive) expr
    if (this.atPunc("(")) {
      const nx = this.peek(1), nx2 = this.peek(2);
      if (nx.t === "kw" && CS_PRIMITIVES.has(nx.v) && nx.v !== "var" && nx2.t === "punc" && nx2.v === ")") {
        this.next();
        const type = this.next().v;
        this.next();
        return { kind: "Cast", type, expr: this.parseUnary(), line: tk.line };
      }
    }
    return this.parsePostfix();
  }

  parsePostfix() {
    let e = this.parsePrimary();
    while (true) {
      if (this.atPunc(".") || this.atPunc("?.")) {
        const optional = this.next().v === "?.";
        const nameTok = this.at("kw") ? this.next() : this.expect("id", undefined, "Identifier expected", "CS1001");
        e = { kind: "Member", obj: e, name: nameTok.v, optional, line: nameTok.line };
      } else if (this.atPunc("(")) {
        e = this.parseCallOn(e, null);
      } else if (this.atPunc("<") && (e.kind === "Member" || e.kind === "Ident") && this.looksLikeGenericCall()) {
        this.next();
        const typeArgs = [this.parseType()];
        while (this.eat("punc", ",")) typeArgs.push(this.parseType());
        this.expect("punc", ">", "> expected", "CS1003");
        e = this.parseCallOn(e, typeArgs);
      } else if (this.atPunc("[")) {
        this.next();
        const idx = this.parseExpression();
        this.expect("punc", "]", "] expected", "CS1003");
        e = { kind: "Index", obj: e, index: idx };
      } else if (this.atPunc("++") || this.atPunc("--")) {
        const op = this.next().v;
        e = { kind: "Unary", op, operand: e, prefix: false };
      } else break;
    }
    return e;
  }
  looksLikeGenericCall() {
    let p = this.pos + 1, depth = 1, guard = 0;
    while (p < this.toks.length && guard++ < 30) {
      const tk = this.toks[p];
      if (tk.t === "punc") {
        if (tk.v === "<") depth++;
        else if (tk.v === ">") {
          depth--;
          if (depth === 0) {
            const after = this.toks[p + 1];
            return after && after.t === "punc" && after.v === "(";
          }
        }
        else if (tk.v !== "," && tk.v !== "." && tk.v !== "[" && tk.v !== "]") return false;
      } else if (tk.t !== "id" && !(tk.t === "kw" && CS_PRIMITIVES.has(tk.v))) return false;
      p++;
    }
    return false;
  }
  parseCallOn(callee, typeArgs) {
    const open = this.expect("punc", "(", "( expected", "CS1003");
    const args = [];
    if (!this.atPunc(")")) {
      do {
        if (this.atKw("out")) {
          this.next();
          let vt = null;
          const p = this.save();
          try {
            vt = this.parseType();
            if (!this.at("id")) { this.restore(p); vt = null; }
          } catch (e) { this.restore(p); vt = null; }
          const vn = this.expect("id", undefined, "Identifier expected", "CS1001").v;
          args.push({ kind: "OutArg", varType: vt, name: vn });
        } else if (this.atKw("ref")) {
          this.next();
          args.push(this.parseExpression());
        } else {
          args.push(this.parseExpression());
        }
      } while (this.eat("punc", ","));
    }
    this.expect("punc", ")", ") expected", "CS1026");
    return { kind: "Call", callee, args, typeArgs, line: open.line };
  }

  parsePrimary() {
    const tk = this.peek();
    if (tk.t === "num") { this.next(); return { kind: "Literal", value: tk.v, litType: "num" }; }
    if (tk.t === "str") { this.next(); return { kind: "Literal", value: tk.v, litType: "str" }; }
    if (tk.t === "char") { this.next(); return { kind: "Literal", value: tk.v, litType: "str" }; }
    if (tk.t === "istr") { this.next(); return this.buildInterp(tk); }
    if (tk.t === "kw") {
      switch (tk.v) {
        case "true": this.next(); return { kind: "Literal", value: true, litType: "bool" };
        case "false": this.next(); return { kind: "Literal", value: false, litType: "bool" };
        case "null": this.next(); return { kind: "Literal", value: null, litType: "null" };
        case "this": this.next(); return { kind: "This" };
        case "base": this.next(); return { kind: "Base" };
        case "new": return this.parseNew();
        case "float": case "int": case "double": case "string": case "bool": case "byte": case "long": case "char": case "object": case "short": case "uint":
          this.next(); return { kind: "Ident", name: tk.v, isPrimitiveType: true, line: tk.line };
      }
      this.err(`Invalid expression term '${tk.v}'`, "CS1525", tk);
    }
    if (tk.t === "id") { this.next(); return { kind: "Ident", name: tk.v, line: tk.line, col: tk.col }; }
    if (this.atPunc("(")) {
      this.next();
      const e = this.parseExpression();
      this.expect("punc", ")", ") expected", "CS1026");
      return { kind: "Paren", expr: e };
    }
    this.err(`Invalid expression term '${tk.v ?? tk.t}'`, "CS1525", tk);
  }

  buildInterp(tk) {
    const parts = [];
    for (const p of tk.v) {
      if (p.type === "text") parts.push({ type: "text", value: p.value });
      else {
        const subToks = csLex(p.src);
        const sub = new CSParser(subToks);
        let expr;
        try {
          expr = sub.parseExpression();
        } catch (e) {
          throw new CSError(e.message, tk.line, tk.col, e.code || "CS1525");
        }
        parts.push({ type: "expr", expr, fmt: p.fmt });
      }
    }
    return { kind: "Interp", parts, line: tk.line };
  }

  parseNew() {
    const tk = this.next(); // new
    const type = this.parseType();
    // array forms
    if (this.atPunc("[")) {
      this.next();
      let size = null;
      if (!this.atPunc("]")) size = this.parseExpression();
      this.expect("punc", "]", "] expected", "CS1003");
      let items = null;
      if (this.atPunc("{")) {
        const ini = this.parseVarInit();
        items = ini.items;
      }
      return { kind: "NewArray", type, size, items, line: tk.line };
    }
    if (type.arrayDims > 0) {
      let items = null;
      if (this.atPunc("{")) items = this.parseVarInit().items;
      return { kind: "NewArray", type, size: null, items, line: tk.line };
    }
    let args = [];
    if (this.atPunc("(")) {
      this.next();
      if (!this.atPunc(")")) {
        do { args.push(this.parseExpression()); } while (this.eat("punc", ","));
      }
      this.expect("punc", ")", ") expected", "CS1026");
    }
    let items = null;
    if (this.atPunc("{")) items = this.parseVarInit().items;
    return { kind: "New", type, args, items, line: tk.line };
  }
}

function csParse(source) {
  const tokens = csLex(source);
  const parser = new CSParser(tokens);
  return parser.parseProgram();
}
