</head><body>

<div id="boot-overlay"><h1><b>Webity</b> CUBE ADVENTURE</h1><p>BUILT WITH THE WEBITY ENGINE — NO EDITOR ATTACHED</p><div class="hint">CLICK TO START &nbsp;·&nbsp; WASD MOVE &nbsp;·&nbsp; SPACE JUMP &nbsp;·&nbsp; SHIFT DASH</div></div>
</div>
<script>
/* ==== js/core/math.js ==== */
/* Webity core math — Unity-style Vector3 / Quaternion / Matrix4 / Color / Mathf */
"use strict";

const DEG2RAD = Math.PI / 180;
const RAD2DEG = 180 / Math.PI;

class Vector3 {
  constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
  clone() { return new Vector3(this.x, this.y, this.z); }
  set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; }
  copy(v) { this.x = v.x; this.y = v.y; this.z = v.z; return this; }
  get magnitude() { return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z); }
  get sqrMagnitude() { return this.x * this.x + this.y * this.y + this.z * this.z; }
  get normalized() {
    const m = this.magnitude;
    return m > 1e-8 ? new Vector3(this.x / m, this.y / m, this.z / m) : new Vector3();
  }
  Normalize() { const m = this.magnitude; if (m > 1e-8) { this.x /= m; this.y /= m; this.z /= m; } return this; }
  add(v) { return new Vector3(this.x + v.x, this.y + v.y, this.z + v.z); }
  sub(v) { return new Vector3(this.x - v.x, this.y - v.y, this.z - v.z); }
  mul(s) { return new Vector3(this.x * s, this.y * s, this.z * s); }
  div(s) { return new Vector3(this.x / s, this.y / s, this.z / s); }
  neg() { return new Vector3(-this.x, -this.y, -this.z); }
  equalsApprox(v) { return Vector3.SqrDistance(this, v) < 1e-10; }
  ToString() { return `(${this.x.toFixed(2)}, ${this.y.toFixed(2)}, ${this.z.toFixed(2)})`; }
  toString() { return this.ToString(); }
  toJSON() { return { x: this.x, y: this.y, z: this.z }; }

  static get zero() { return new Vector3(0, 0, 0); }
  static get one() { return new Vector3(1, 1, 1); }
  static get up() { return new Vector3(0, 1, 0); }
  static get down() { return new Vector3(0, -1, 0); }
  static get left() { return new Vector3(-1, 0, 0); }
  static get right() { return new Vector3(1, 0, 0); }
  static get forward() { return new Vector3(0, 0, 1); }
  static get back() { return new Vector3(0, 0, -1); }
  static Dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
  static Cross(a, b) {
    return new Vector3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  }
  static Distance(a, b) { const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z; return Math.sqrt(dx * dx + dy * dy + dz * dz); }
  static SqrDistance(a, b) { const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z; return dx * dx + dy * dy + dz * dz; }
  static Lerp(a, b, t) { t = Mathf.Clamp01(t); return new Vector3(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t); }
  static LerpUnclamped(a, b, t) { return new Vector3(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t); }
  static MoveTowards(a, b, maxDelta) {
    const d = b.sub(a), m = d.magnitude;
    if (m <= maxDelta || m < 1e-8) return b.clone();
    return a.add(d.mul(maxDelta / m));
  }
  static Scale(a, b) { return new Vector3(a.x * b.x, a.y * b.y, a.z * b.z); }
  static Min(a, b) { return new Vector3(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.min(a.z, b.z)); }
  static Max(a, b) { return new Vector3(Math.max(a.x, b.x), Math.max(a.y, b.y), Math.max(a.z, b.z)); }
  static ProjectOnPlane(v, n) { const d = Vector3.Dot(v, n) / Math.max(n.sqrMagnitude, 1e-9); return v.sub(n.mul(d)); }
  static Angle(a, b) {
    const d = Math.sqrt(a.sqrMagnitude * b.sqrMagnitude);
    if (d < 1e-12) return 0;
    return Math.acos(Mathf.Clamp(Vector3.Dot(a, b) / d, -1, 1)) * RAD2DEG;
  }
  static SignedAngle(a, b, axis) {
    const ang = Vector3.Angle(a, b);
    const s = Math.sign(Vector3.Dot(axis, Vector3.Cross(a, b)));
    return ang * (s === 0 ? 1 : s);
  }
  static ClampMagnitude(v, max) { const m = v.magnitude; return m > max ? v.mul(max / m) : v.clone(); }
  static SmoothDamp(current, target, velRef, smoothTime, dt, maxSpeed = Infinity) {
    // velRef: {v:Vector3}
    smoothTime = Math.max(0.0001, smoothTime);
    const omega = 2 / smoothTime;
    const x = omega * dt;
    const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    let change = current.sub(target);
    const maxChange = maxSpeed * smoothTime;
    change = Vector3.ClampMagnitude(change, maxChange);
    const t2 = current.sub(change);
    const temp = velRef.v.add(change.mul(omega)).mul(dt);
    velRef.v = velRef.v.sub(temp.mul(omega)).mul(exp);
    let output = t2.add(change.add(temp).mul(exp));
    if (Vector3.Dot(target.sub(current), output.sub(target)) > 0) { output = target.clone(); velRef.v = new Vector3(); }
    return output;
  }
  static from(o) { return o instanceof Vector3 ? o : new Vector3(o?.x || 0, o?.y || 0, o?.z || 0); }
}

class Vector2 {
  constructor(x = 0, y = 0) { this.x = x; this.y = y; }
  clone() { return new Vector2(this.x, this.y); }
  get magnitude() { return Math.hypot(this.x, this.y); }
  get normalized() { const m = this.magnitude; return m > 1e-8 ? new Vector2(this.x / m, this.y / m) : new Vector2(); }
  add(v) { return new Vector2(this.x + v.x, this.y + v.y); }
  sub(v) { return new Vector2(this.x - v.x, this.y - v.y); }
  mul(s) { return new Vector2(this.x * s, this.y * s); }
  div(s) { return new Vector2(this.x / s, this.y / s); }
  neg() { return new Vector2(-this.x, -this.y); }
  static get zero() { return new Vector2(0, 0); }
  static get one() { return new Vector2(1, 1); }
  toJSON() { return { x: this.x, y: this.y }; }
}

class Quaternion {
  constructor(x = 0, y = 0, z = 0, w = 1) { this.x = x; this.y = y; this.z = z; this.w = w; }
  clone() { return new Quaternion(this.x, this.y, this.z, this.w); }
  set(x, y, z, w) { this.x = x; this.y = y; this.z = z; this.w = w; return this; }
  copy(q) { this.x = q.x; this.y = q.y; this.z = q.z; this.w = q.w; return this; }
  static get identity() { return new Quaternion(0, 0, 0, 1); }
  mulQ(b) {
    const a = this;
    return new Quaternion(
      a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
      a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
      a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
      a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z
    );
  }
  mulV(v) {
    // rotate vector
    const x = this.x, y = this.y, z = this.z, w = this.w;
    const ix = w * v.x + y * v.z - z * v.y;
    const iy = w * v.y + z * v.x - x * v.z;
    const iz = w * v.z + x * v.y - y * v.x;
    const iw = -x * v.x - y * v.y - z * v.z;
    return new Vector3(
      ix * w + iw * -x + iy * -z - iz * -y,
      iy * w + iw * -y + iz * -x - ix * -z,
      iz * w + iw * -z + ix * -y - iy * -x
    );
  }
  get normalized() {
    const m = Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z + this.w * this.w);
    if (m < 1e-9) return Quaternion.identity;
    return new Quaternion(this.x / m, this.y / m, this.z / m, this.w / m);
  }
  inverse() { return new Quaternion(-this.x, -this.y, -this.z, this.w); }
  get eulerAngles() {
    // Unity order: extrinsic Z-X-Y (q = qy * qx * qz). Extract in degrees.
    const { x, y, z, w } = this;
    const sinX = 2 * (w * x - y * z);
    let ex, ey, ez;
    if (Math.abs(sinX) > 0.99999) {
      ex = Math.sign(sinX) * 90;
      ey = Math.atan2(2 * (w * y - x * z), 1 - 2 * (y * y + z * z)) * RAD2DEG * Math.sign(sinX) >= 0 ?
        Math.atan2(2 * (y * w + x * z), 1 - 2 * (x * x + y * y)) * RAD2DEG : 0;
      // gimbal lock: fold everything into Y
      ey = Math.atan2(2 * (y * w + x * z), 1 - 2 * (x * x + y * y)) * RAD2DEG;
      ez = 0;
    } else {
      ex = Math.asin(sinX) * RAD2DEG;
      ey = Math.atan2(2 * (w * y + x * z), 1 - 2 * (x * x + y * y)) * RAD2DEG;
      ez = Math.atan2(2 * (w * z + x * y), 1 - 2 * (x * x + z * z)) * RAD2DEG;
    }
    const norm = (a) => { a %= 360; return a < 0 ? a + 360 : a; };
    return new Vector3(norm(ex), norm(ey), norm(ez));
  }
  static Euler(x, y, z) {
    if (x instanceof Vector3) { z = x.z; y = x.y; x = x.x; }
    const rx = x * DEG2RAD / 2, ry = y * DEG2RAD / 2, rz = z * DEG2RAD / 2;
    const cx = Math.cos(rx), sx = Math.sin(rx);
    const cy = Math.cos(ry), sy = Math.sin(ry);
    const cz = Math.cos(rz), sz = Math.sin(rz);
    // q = qy * qx * qz
    return new Quaternion(
      sx * cy * cz + cx * sy * sz,
      cx * sy * cz - sx * cy * sz,
      cx * cy * sz - sx * sy * cz,
      cx * cy * cz + sx * sy * sz
    );
  }
  static AngleAxis(deg, axis) {
    const a = axis.normalized, h = deg * DEG2RAD / 2, s = Math.sin(h);
    return new Quaternion(a.x * s, a.y * s, a.z * s, Math.cos(h));
  }
  static Dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z + a.w * b.w; }
  static Angle(a, b) {
    const d = Math.min(Math.abs(Quaternion.Dot(a, b)), 1);
    return Math.acos(d) * 2 * RAD2DEG;
  }
  static LookRotation(forward, up = Vector3.up) {
    const f = forward.normalized;
    if (f.magnitude < 1e-8) return Quaternion.identity;
    let r = Vector3.Cross(up, f);
    if (r.sqrMagnitude < 1e-8) r = Vector3.Cross(new Vector3(0, 0, 1), f);
    r = r.normalized;
    const u = Vector3.Cross(f, r);
    // build from basis (column-major rotation matrix -> quaternion)
    const m00 = r.x, m01 = u.x, m02 = f.x;
    const m10 = r.y, m11 = u.y, m12 = f.y;
    const m20 = r.z, m21 = u.z, m22 = f.z;
    const tr = m00 + m11 + m22;
    let q;
    if (tr > 0) {
      const s = Math.sqrt(tr + 1) * 2;
      q = new Quaternion((m21 - m12) / s, (m02 - m20) / s, (m10 - m01) / s, s / 4);
    } else if (m00 > m11 && m00 > m22) {
      const s = Math.sqrt(1 + m00 - m11 - m22) * 2;
      q = new Quaternion(s / 4, (m01 + m10) / s, (m02 + m20) / s, (m21 - m12) / s);
    } else if (m11 > m22) {
      const s = Math.sqrt(1 + m11 - m00 - m22) * 2;
      q = new Quaternion((m01 + m10) / s, s / 4, (m12 + m21) / s, (m02 - m20) / s);
    } else {
      const s = Math.sqrt(1 + m22 - m00 - m11) * 2;
      q = new Quaternion((m02 + m20) / s, (m12 + m21) / s, s / 4, (m10 - m01) / s);
    }
    return q.normalized;
  }
  static Slerp(a, b, t) {
    t = Mathf.Clamp01(t);
    return Quaternion.SlerpUnclamped(a, b, t);
  }
  static SlerpUnclamped(a, b, t) {
    let bx = b.x, by = b.y, bz = b.z, bw = b.w;
    let cos = Quaternion.Dot(a, b);
    if (cos < 0) { cos = -cos; bx = -bx; by = -by; bz = -bz; bw = -bw; }
    let k0, k1;
    if (cos > 0.9995) { k0 = 1 - t; k1 = t; }
    else {
      const theta = Math.acos(cos), sin = Math.sin(theta);
      k0 = Math.sin((1 - t) * theta) / sin;
      k1 = Math.sin(t * theta) / sin;
    }
    return new Quaternion(a.x * k0 + bx * k1, a.y * k0 + by * k1, a.z * k0 + bz * k1, a.w * k0 + bw * k1).normalized;
  }
  static RotateTowards(a, b, maxDeg) {
    const ang = Quaternion.Angle(a, b);
    if (ang < 1e-5) return b.clone();
    return Quaternion.SlerpUnclamped(a, b, Math.min(1, maxDeg / ang));
  }
  toJSON() { return { x: this.x, y: this.y, z: this.z, w: this.w }; }
  static from(o) { return o instanceof Quaternion ? o : new Quaternion(o?.x || 0, o?.y || 0, o?.z || 0, o?.w ?? 1); }
}

/* Column-major 4x4 matrix (WebGL layout) */
class Matrix4 {
  constructor() { this.m = new Float32Array(16); this.identity(); }
  identity() { const m = this.m; m.fill(0); m[0] = m[5] = m[10] = m[15] = 1; return this; }
  copy(o) { this.m.set(o.m); return this; }
  clone() { return new Matrix4().copy(this); }
  static TRS(pos, rot, scale) {
    const t = new Matrix4(), m = t.m;
    const { x, y, z, w } = rot;
    const x2 = x + x, y2 = y + y, z2 = z + z;
    const xx = x * x2, xy = x * y2, xz = x * z2;
    const yy = y * y2, yz = y * z2, zz = z * z2;
    const wx = w * x2, wy = w * y2, wz = w * z2;
    const sx = scale.x, sy = scale.y, sz = scale.z;
    m[0] = (1 - (yy + zz)) * sx; m[1] = (xy + wz) * sx; m[2] = (xz - wy) * sx; m[3] = 0;
    m[4] = (xy - wz) * sy; m[5] = (1 - (xx + zz)) * sy; m[6] = (yz + wx) * sy; m[7] = 0;
    m[8] = (xz + wy) * sz; m[9] = (yz - wx) * sz; m[10] = (1 - (xx + yy)) * sz; m[11] = 0;
    m[12] = pos.x; m[13] = pos.y; m[14] = pos.z; m[15] = 1;
    return t;
  }
  mul(b) { // this * b
    const out = new Matrix4(), a = this.m, bm = b.m, o = out.m;
    for (let c = 0; c < 4; c++) {
      const bc = c * 4;
      const b0 = bm[bc], b1 = bm[bc + 1], b2 = bm[bc + 2], b3 = bm[bc + 3];
      o[bc] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
      o[bc + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
      o[bc + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
      o[bc + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
    }
    return out;
  }
  mulPoint(v) {
    const m = this.m;
    const w = m[3] * v.x + m[7] * v.y + m[11] * v.z + m[15] || 1;
    return new Vector3(
      (m[0] * v.x + m[4] * v.y + m[8] * v.z + m[12]) / w,
      (m[1] * v.x + m[5] * v.y + m[9] * v.z + m[13]) / w,
      (m[2] * v.x + m[6] * v.y + m[10] * v.z + m[14]) / w
    );
  }
  mulDir(v) {
    const m = this.m;
    return new Vector3(
      m[0] * v.x + m[4] * v.y + m[8] * v.z,
      m[1] * v.x + m[5] * v.y + m[9] * v.z,
      m[2] * v.x + m[6] * v.y + m[10] * v.z
    );
  }
  invert() {
    const m = this.m, inv = new Float32Array(16);
    inv[0] = m[5]*m[10]*m[15]-m[5]*m[11]*m[14]-m[9]*m[6]*m[15]+m[9]*m[7]*m[14]+m[13]*m[6]*m[11]-m[13]*m[7]*m[10];
    inv[4] = -m[4]*m[10]*m[15]+m[4]*m[11]*m[14]+m[8]*m[6]*m[15]-m[8]*m[7]*m[14]-m[12]*m[6]*m[11]+m[12]*m[7]*m[10];
    inv[8] = m[4]*m[9]*m[15]-m[4]*m[11]*m[13]-m[8]*m[5]*m[15]+m[8]*m[7]*m[13]+m[12]*m[5]*m[11]-m[12]*m[7]*m[9];
    inv[12] = -m[4]*m[9]*m[14]+m[4]*m[10]*m[13]+m[8]*m[5]*m[14]-m[8]*m[6]*m[13]-m[12]*m[5]*m[10]+m[12]*m[6]*m[9];
    inv[1] = -m[1]*m[10]*m[15]+m[1]*m[11]*m[14]+m[9]*m[2]*m[15]-m[9]*m[3]*m[14]-m[13]*m[2]*m[11]+m[13]*m[3]*m[10];
    inv[5] = m[0]*m[10]*m[15]-m[0]*m[11]*m[14]-m[8]*m[2]*m[15]+m[8]*m[3]*m[14]+m[12]*m[2]*m[11]-m[12]*m[3]*m[10];
    inv[9] = -m[0]*m[9]*m[15]+m[0]*m[11]*m[13]+m[8]*m[1]*m[15]-m[8]*m[3]*m[13]-m[12]*m[1]*m[11]+m[12]*m[3]*m[9];
    inv[13] = m[0]*m[9]*m[14]-m[0]*m[10]*m[13]-m[8]*m[1]*m[14]+m[8]*m[2]*m[13]+m[12]*m[1]*m[10]-m[12]*m[2]*m[9];
    inv[2] = m[1]*m[6]*m[15]-m[1]*m[7]*m[14]-m[5]*m[2]*m[15]+m[5]*m[3]*m[14]+m[13]*m[2]*m[7]-m[13]*m[3]*m[6];
    inv[6] = -m[0]*m[6]*m[15]+m[0]*m[7]*m[14]+m[4]*m[2]*m[15]-m[4]*m[3]*m[14]-m[12]*m[2]*m[7]+m[12]*m[3]*m[6];
    inv[10] = m[0]*m[5]*m[15]-m[0]*m[7]*m[13]-m[4]*m[1]*m[15]+m[4]*m[3]*m[13]+m[12]*m[1]*m[7]-m[12]*m[3]*m[5];
    inv[14] = -m[0]*m[5]*m[14]+m[0]*m[6]*m[13]+m[4]*m[1]*m[14]-m[4]*m[2]*m[13]-m[12]*m[1]*m[6]+m[12]*m[2]*m[5];
    inv[3] = -m[1]*m[6]*m[11]+m[1]*m[7]*m[10]+m[5]*m[2]*m[11]-m[5]*m[3]*m[10]-m[9]*m[2]*m[7]+m[9]*m[3]*m[6];
    inv[7] = m[0]*m[6]*m[11]-m[0]*m[7]*m[10]-m[4]*m[2]*m[11]+m[4]*m[3]*m[10]+m[8]*m[2]*m[7]-m[8]*m[3]*m[6];
    inv[11] = -m[0]*m[5]*m[11]+m[0]*m[7]*m[9]+m[4]*m[1]*m[11]-m[4]*m[3]*m[9]-m[8]*m[1]*m[7]+m[8]*m[3]*m[5];
    inv[15] = m[0]*m[5]*m[10]-m[0]*m[6]*m[9]-m[4]*m[1]*m[10]+m[4]*m[2]*m[9]+m[8]*m[1]*m[6]-m[8]*m[2]*m[5];
    let det = m[0]*inv[0]+m[1]*inv[4]+m[2]*inv[8]+m[3]*inv[12];
    const out = new Matrix4();
    if (Math.abs(det) < 1e-12) return out;
    det = 1 / det;

      ix.push(a, b, a + 1, a + 1, b, b + 1);
    }
    return build(p, n, u, ix);
  }

  function crystal() {
    // elongated hexagonal bipyramid gem — flat shaded
    const top = [0, 0.62, 0], bottom = [0, -0.62, 0];
    const upper = [], lower = [];
    const R = 0.28;
    for (let i = 0; i < 6; i++) {
      const th = Math.PI * 2 * i / 6;
      upper.push([Math.cos(th) * R, 0.22, Math.sin(th) * R]);
      lower.push([Math.cos(th) * R, -0.22, Math.sin(th) * R]);
    }
    const p = [], n = [], u = [], ix = [];
    function tri(a, b, c) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
      const base = p.length / 3;
      for (const v of [a, b, c]) { p.push(...v); n.push(nx, ny, nz); u.push(0.5, 0.5); }
      ix.push(base, base + 1, base + 2);
    }
    for (let i = 0; i < 6; i++) {
      const j = (i + 1) % 6;
      tri(top, upper[j], upper[i]);
      tri(upper[i], upper[j], lower[j]);
      tri(upper[i], lower[j], lower[i]);
      tri(bottom, lower[i], lower[j]);
    }
    return build(p, n, u, ix);
  }

  const cache = {};
  const generators = {
    Cube: cube,
    Sphere: () => sphere(),
    Capsule: () => capsule(),
    Cylinder: () => cylinder(),
    Plane: () => plane(10, 10),
    Quad: quad,
    Cone: () => cone(),
    Torus: () => torus(),
    Crystal: crystal,
  };
  function get(name) {
    if (!cache[name]) {
      const gen = generators[name] || cube;
      cache[name] = gen();
      cache[name].name = name;
    }
    return cache[name];
  }
  return { get, names: Object.keys(generators), computeBounds };
})();


/* ==== js/core/input.js ==== */
/* Webity Input system — keyboard state, Unity-style axes & buttons */
"use strict";

const WInput = (() => {
  const down = new Set();      // currently held (normalized names)
  const pressed = new Set();   // went down this frame
  const released = new Set();  // went up this frame
  const pendingDown = new Set(), pendingUp = new Set();
  const axes = { Horizontal: 0, Vertical: 0 };
  const axesRaw = { Horizontal: 0, Vertical: 0 };
  let captureGame = false;     // when true, game consumes keys (prevents editor/browser default)
  let anyKeyDownFrame = false, pendingAnyKey = false;

  const KEYMAP = {
    " ": "Space", "ArrowUp": "UpArrow", "ArrowDown": "DownArrow",
    "ArrowLeft": "LeftArrow", "ArrowRight": "RightArrow",
    "Escape": "Escape", "Enter": "Return", "Shift": "LeftShift",
    "Control": "LeftControl", "Alt": "LeftAlt", "Tab": "Tab", "Backspace": "Backspace",
  };
  function normKey(e) {
    let k = e.key;
    if (KEYMAP[k]) return KEYMAP[k];
    if (k.length === 1) {
      const u = k.toUpperCase();
      if (u >= "A" && u <= "Z") return u;
      if (u >= "0" && u <= "9") return "Alpha" + u;
    }
    return k;
  }

  const GAME_KEYS = new Set(["Space", "UpArrow", "DownArrow", "LeftArrow", "RightArrow",
    "W", "A", "S", "D", "R", "LeftShift", "E", "Q", "Tab"]);

  function onKeyDown(e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable)) return;
    const k = normKey(e);
    if (captureGame && GAME_KEYS.has(k)) e.preventDefault();
    if (!down.has(k)) { pendingDown.add(k); pendingAnyKey = true; }
    down.add(k);
  }
  function onKeyUp(e) {
    const k = normKey(e);
    down.delete(k);
    pendingUp.add(k);
  }
  window.addEventListener("keydown", onKeyDown, true);
  window.addEventListener("keyup", onKeyUp, true);
  window.addEventListener("blur", () => { down.clear(); });

  function newFrame(dt) {
    pressed.clear(); released.clear();
    for (const k of pendingDown) pressed.add(k);
    for (const k of pendingUp) released.add(k);
    pendingDown.clear(); pendingUp.clear();
    anyKeyDownFrame = pendingAnyKey; pendingAnyKey = false;

    // axes
    const h = (has("D") || has("RightArrow") ? 1 : 0) - (has("A") || has("LeftArrow") ? 1 : 0);
    const v = (has("W") || has("UpArrow") ? 1 : 0) - (has("S") || has("DownArrow") ? 1 : 0);
    axesRaw.Horizontal = h; axesRaw.Vertical = v;
    const speed = 8 * (dt || 0.016);
    for (const [name, target] of [["Horizontal", h], ["Vertical", v]]) {
      let cur = axes[name];
      if (target === 0) cur = Mathf.MoveTowards(cur, 0, speed * 1.6);
      else cur = Mathf.MoveTowards(cur, target, speed);
      axes[name] = Mathf.Clamp(cur, -1, 1);
    }
  }
  function has(k) { return captureGame && down.has(k); }

  const BUTTONS = {
    Jump: ["Space"],
    Dash: ["LeftShift"],
    Submit: ["Return"],
    Cancel: ["Escape"],
    Fire1: ["LeftControl"],
  };
  function keysFor(btn) { return BUTTONS[btn] || [btn]; }

  return {
    newFrame,
    setCapture(v) { captureGame = v; if (!v) { axes.Horizontal = 0; axes.Vertical = 0; } },
    get capturing() { return captureGame; },
    clearFrame() { pressed.clear(); released.clear(); anyKeyDownFrame = false; },
    GetAxis(name) { return captureGame ? (axes[name] || 0) : 0; },
    GetAxisRaw(name) { return captureGame ? (axesRaw[name] || 0) : 0; },
    GetKey(k) { return captureGame && down.has(k); },
    GetKeyDown(k) { return captureGame && pressed.has(k); },
    GetKeyUp(k) { return captureGame && released.has(k); },
    GetButton(b) { return captureGame && keysFor(b).some((k) => down.has(k)); },
    GetButtonDown(b) { return captureGame && keysFor(b).some((k) => pressed.has(k)); },
    GetButtonUp(b) { return captureGame && keysFor(b).some((k) => released.has(k)); },
    get anyKeyDown() { return captureGame && anyKeyDownFrame; },
    get anyKey() { return captureGame && down.size > 0; },
    rawKeyDown(k) { return pressed.has(k); }, // editor-side, ignores capture
    rawKeyHeld(k) { return down.has(k); },
  };
})();


/* ==== js/core/audio.js ==== */
/* Webity Audio — WebAudio synthesized clips (no external assets) */
"use strict";

const WAudio = (() => {
  let ctx = null, master = null, sfxGain = null, bgmGain = null;
  let sfxVolume = 0.8, bgmVolume = 0.5;
  let bgmTimer = null, bgmStep = 0, bgmPlaying = false, bgmNextTime = 0;

  function ensure() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      sfxGain = ctx.createGain(); sfxGain.gain.value = sfxVolume; sfxGain.connect(master);
      bgmGain = ctx.createGain(); bgmGain.gain.value = bgmVolume; bgmGain.connect(master);
      return true;
    } catch (e) { return false; }
  }
  function unlock() { if (ensure() && ctx.state === "suspended") ctx.resume(); }
  document.addEventListener("pointerdown", unlock, true);
  document.addEventListener("keydown", unlock, true);

  function env(g, t, a, d, peak = 1, sustain = 0) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(sustain, 0.0001), t + a + d);
  }
  function osc(type, freq, t0, dur, gainNode, freqEnd) {
    const o = ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    o.connect(gainNode); o.start(t0); o.stop(t0 + dur + 0.05);
    return o;
  }
  function tone({ type = "sine", freq = 440, freqEnd = 0, dur = 0.2, attack = 0.005, vol = 0.5, delay = 0, dest = null }) {
    const t0 = ctx.currentTime + delay;
    const g = ctx.createGain();
    env(g, t0, attack, dur, vol);
    g.connect(dest || sfxGain);
    osc(type, freq, t0, dur, g, freqEnd);
  }
  function noise({ dur = 0.2, vol = 0.3, delay = 0, freq = 1000, q = 1 }) {
    const t0 = ctx.currentTime + delay;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); env(g, t0, 0.005, dur, vol);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t0);
  }

  const CLIPS = {
    jump: (v, p) => { tone({ type: "square", freq: 320 * p, freqEnd: 660 * p, dur: 0.14, vol: 0.25 * v }); },
    doublejump: (v, p) => { tone({ type: "square", freq: 420 * p, freqEnd: 880 * p, dur: 0.13, vol: 0.22 * v }); },
    land: (v) => { noise({ dur: 0.08, vol: 0.18 * v, freq: 400, q: 0.7 }); },
    footstep: (v) => { noise({ dur: 0.04, vol: 0.06 * v, freq: 700, q: 1 }); },
    dash: (v) => { noise({ dur: 0.22, vol: 0.14 * v, freq: 1800, q: 0.5 }); tone({ type: "sawtooth", freq: 200, freqEnd: 90, dur: 0.2, vol: 0.1 * v }); },
    collect: (v, p) => {
      [660, 880, 1320].forEach((f, i) => tone({ type: "sine", freq: f * p, dur: 0.18, vol: 0.28 * v, delay: i * 0.07 }));
      tone({ type: "triangle", freq: 1760 * p, dur: 0.3, vol: 0.12 * v, delay: 0.2 });
    },
    damage: (v) => { tone({ type: "sawtooth", freq: 220, freqEnd: 80, dur: 0.25, vol: 0.3 * v }); noise({ dur: 0.15, vol: 0.2 * v, freq: 250, q: 0.8 }); },
    fall: (v) => { tone({ type: "sine", freq: 600, freqEnd: 100, dur: 0.5, vol: 0.25 * v }); },
    jumppad: (v) => { tone({ type: "sine", freq: 200, freqEnd: 900, dur: 0.3, vol: 0.3 * v }); tone({ type: "square", freq: 400, freqEnd: 1200, dur: 0.2, vol: 0.1 * v }); },
    checkpoint: (v) => { [523, 659, 784].forEach((f, i) => tone({ type: "triangle", freq: f, dur: 0.25, vol: 0.25 * v, delay: i * 0.09 })); },
    goal: (v) => {
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) =>
        tone({ type: "triangle", freq: f, dur: 0.3, vol: 0.3 * v, delay: i * 0.12 }));
    },
    gameover: (v) => { [392, 370, 349, 262].forEach((f, i) => tone({ type: "sawtooth", freq: f, dur: 0.4, vol: 0.18 * v, delay: i * 0.25 })); },
    click: (v) => { tone({ type: "sine", freq: 900, dur: 0.05, vol: 0.2 * v }); },
    enemy_alert: (v) => { tone({ type: "square", freq: 700, dur: 0.09, vol: 0.15 * v }); tone({ type: "square", freq: 700, dur: 0.09, vol: 0.15 * v, delay: 0.12 }); },
    falling_floor: (v) => { noise({ dur: 0.3, vol: 0.15 * v, freq: 180, q: 0.6 }); },
    countdown: (v) => { tone({ type: "sine", freq: 880, dur: 0.1, vol: 0.2 * v }); },
  };

  /* Simple generative BGM: bass + arpeggio, 8-step loop */
  const BGM_PATTERNS = {
    bgm_main: {
      bpm: 112,
      bass: [110, 110, 87.3, 87.3, 98, 98, 73.4, 82.4],
      arp: [[220, 277, 330], [220, 277, 330], [174.6, 220, 261.6], [174.6, 220, 261.6],
            [196, 246.9, 293.7], [196, 246.9, 293.7], [146.8, 185, 220], [164.8, 207.7, 246.9]],
    },
  };
  let bgmName = null;
  function bgmTick() {
    if (!bgmPlaying || !ctx) return;
    const pat = BGM_PATTERNS[bgmName] || BGM_PATTERNS.bgm_main;
    const stepDur = 60 / pat.bpm;
    while (bgmNextTime < ctx.currentTime + 0.35) {
      const s = bgmStep % 8;
      const t0 = bgmNextTime;
      // bass
      const bg = ctx.createGain(); env(bg, t0, 0.01, stepDur * 0.85, 0.16); bg.connect(bgmGain);
      osc("triangle", pat.bass[s], t0, stepDur * 0.9, bg);
      // arpeggio (3 notes per step)
      const chord = pat.arp[s];
      for (let i = 0; i < 3; i++) {
        const nt = t0 + (stepDur / 3) * i;
        const ag = ctx.createGain(); env(ag, nt, 0.008, stepDur / 3 * 0.9, 0.07); ag.connect(bgmGain);
        osc("square", chord[i % chord.length] * 2, nt, stepDur / 3, ag);
      }
      // hat
      if (s % 2 === 0) {
        const len = Math.floor(ctx.sampleRate * 0.03);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const hf = ctx.createBiquadFilter(); hf.type = "highpass"; hf.frequency.value = 6000;
        const hg = ctx.createGain(); hg.gain.value = 0.05;
        src.connect(hf); hf.connect(hg); hg.connect(bgmGain); src.start(t0);
      }
      bgmNextTime += stepDur;
      bgmStep++;
    }
  }

  return {
    get clipNames() { return Object.keys(CLIPS).concat(Object.keys(BGM_PATTERNS)); },
    isBGM(name) { return !!BGM_PATTERNS[name]; },
    play(name, volume = 1, pitch = 1) {
      if (!ensure()) return;
      if (ctx.state === "suspended") ctx.resume();
      if (BGM_PATTERNS[name]) { this.playBGM(name); return; }
      const fn = CLIPS[name];
      if (fn) { try { fn(volume, pitch || 1); } catch (e) { /* audio glitch — ignore */ } }
    },
    playBGM(name) {
      if (!ensure()) return;
      if (bgmPlaying && bgmName === name) return;
      bgmName = name; bgmPlaying = true; bgmStep = 0;
      bgmNextTime = ctx.currentTime + 0.05;
      if (!bgmTimer) bgmTimer = setInterval(bgmTick, 80);
    },
    stopBGM() { bgmPlaying = false; if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } },
    stopAll() { this.stopBGM(); },
    setSfxVolume(v) { sfxVolume = v; if (sfxGain) sfxGain.gain.value = v; },
    setBgmVolume(v) { bgmVolume = v; if (bgmGain) bgmGain.gain.value = v; },
    getSfxVolume() { return sfxVolume; },
    getBgmVolume() { return bgmVolume; },
    setBgmPaused(p) { if (bgmGain) bgmGain.gain.value = p ? 0 : bgmVolume; },
  };
})();


/* ==== js/core/renderer.js ==== */
/* Webity WebGL2 renderer — lit pass, shadow map, sky, lines, particles, post-process */
"use strict";

const WRenderer = (() => {
  let gl = null, canvas = null;
  let progLit, progUnlit, progSky, progParticle, progPost, progShadow;
  const meshCache = new WeakMap();
  const texCache = {};
  let shadowFBO = null, shadowTex = null;
  const SHADOW_SIZE = 2048;
  let shadowVP = new Matrix4();
  let shadowReady = false;
  let lineBuf = null, lineVAO = null, lineCapacity = 0;
  let partBuf = null, partVAO = null, partIdxBuf = null, partCapacity = 0;
  let postFBO = null, postTex = null, postDepth = null, postW = 0, postH = 0;
  let quadVAO = null;
  let dpr = 1;
  let stats = { drawCalls: 0, tris: 0 };

  /* ---------------- shaders ---------------- */
  function compile(vs, fs, name) {
    function sh(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error(`Shader ${name}: ${gl.getShaderInfoLog(s)}`);
      return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error(`Link ${name}: ${gl.getProgramInfoLog(p)}`);
    const uniforms = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      uniforms[info.name.replace("[0]", "")] = gl.getUniformLocation(p, info.name);
    }
    return { prog: p, u: uniforms };
  }

  const LIT_VS = `#version 300 es
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aNormal;
  layout(location=2) in vec2 aUV;
  uniform mat4 uProj, uView, uModel;
  uniform mat4 uShadowVP;
  out vec3 vWorldPos; out vec3 vNormal; out vec2 vUV; out vec4 vShadowCoord;
  void main() {
    vec4 wp = uModel * vec4(aPos, 1.0);
    vWorldPos = wp.xyz;
    vNormal = mat3(uModel) * aNormal;
    vUV = aUV;
    vShadowCoord = uShadowVP * wp;
    gl_Position = uProj * uView * wp;
  }`;

  const LIT_FS = `#version 300 es
  precision highp float;
  in vec3 vWorldPos; in vec3 vNormal; in vec2 vUV; in vec4 vShadowCoord;
  uniform vec4 uColor;
  uniform vec3 uEmission;
  uniform vec3 uLightDir;     // direction TOWARDS light
  uniform vec3 uLightColor;
  uniform vec3 uAmbientSky, uAmbientGround;
  uniform vec3 uCameraPos;
  uniform float uSpecStrength, uSpecPower;
  uniform int uUseTex;
  uniform sampler2D uTexture;
  uniform float uTexScale;
  uniform int uReceiveShadow;
  uniform highp sampler2DShadow uShadowMap;
  uniform vec4 uFogColor; uniform float uFogDensity;
  out vec4 fragColor;
  float shadowFactor() {
    if (uReceiveShadow == 0) return 1.0;
    vec3 sc = vShadowCoord.xyz / vShadowCoord.w;
    sc = sc * 0.5 + 0.5;
    if (sc.x < 0.0 || sc.x > 1.0 || sc.y < 0.0 || sc.y > 1.0 || sc.z > 1.0) return 1.0;
    float sum = 0.0;
    float texel = 1.0 / 2048.0;
    for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++) {
      sum += texture(uShadowMap, vec3(sc.xy + vec2(float(i), float(j)) * texel, sc.z - 0.0028));
    }
    return 0.35 + 0.65 * (sum / 9.0);
  }
  void main() {
    vec3 n = normalize(vNormal);
    vec3 viewDir = normalize(uCameraPos - vWorldPos);
    if (dot(n, viewDir) < 0.0) n = -n; // double sided
    vec4 albedo = uColor;
    if (uUseTex == 1) albedo *= texture(uTexture, vUV * uTexScale);
    float ndl = max(dot(n, uLightDir), 0.0);
    float sh = shadowFactor();
    vec3 hemi = mix(uAmbientGround, uAmbientSky, n.y * 0.5 + 0.5);
    vec3 diffuse = uLightColor * ndl * sh;
    vec3 h = normalize(uLightDir + viewDir);
    float spec = pow(max(dot(n, h), 0.0), uSpecPower) * uSpecStrength * sh * step(0.01, ndl);
    vec3 col = albedo.rgb * (diffuse + hemi) + uLightColor * spec + uEmission;
    float dist = length(uCameraPos - vWorldPos);
    float fog = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
    col = mix(col, uFogColor.rgb, clamp(fog, 0.0, 1.0) * uFogColor.a);
    fragColor = vec4(col, albedo.a);
  }`;

  const SHADOW_VS = `#version 300 es
  layout(location=0) in vec3 aPos;
  uniform mat4 uShadowVP, uModel;
  void main() { gl_Position = uShadowVP * uModel * vec4(aPos, 1.0); }`;
  const SHADOW_FS = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  void main() { fragColor = vec4(1.0); }`;

  const UNLIT_VS = `#version 300 es
  layout(location=0) in vec3 aPos;
  uniform mat4 uProj, uView, uModel;
  void main() { gl_Position = uProj * uView * uModel * vec4(aPos, 1.0); }`;
  const UNLIT_FS = `#version 300 es
  precision highp float;
  uniform vec4 uColor;
  out vec4 fragColor;
  void main() { fragColor = uColor; }`;

  const SKY_VS = `#version 300 es
  layout(location=0) in vec2 aPos;
  out vec2 vPos;
  void main() { vPos = aPos; gl_Position = vec4(aPos, 0.99999, 1.0); }`;
  const SKY_FS = `#version 300 es
  precision highp float;
  in vec2 vPos;
  uniform vec3 uTop, uHorizon, uBottom;
  uniform mat4 uInvVP;
  out vec4 fragColor;
  void main() {
    vec4 a = uInvVP * vec4(vPos, 0.1, 1.0);
    vec4 b = uInvVP * vec4(vPos, 0.9, 1.0);
    vec3 dir = normalize(b.xyz / b.w - a.xyz / a.w);
    float t = dir.y;
    vec3 col = t > 0.0 ? mix(uHorizon, uTop, pow(min(t * 1.4, 1.0), 0.7))
                       : mix(uHorizon, uBottom, pow(min(-t * 2.0, 1.0), 0.6));
    // subtle sun glow
    fragColor = vec4(col, 1.0);
  }`;

  const PART_VS = `#version 300 es
  layout(location=0) in vec3 aCenter;
  layout(location=1) in vec2 aOffset;
  layout(location=2) in vec4 aColor;
  layout(location=3) in float aSize;
  uniform mat4 uProj, uView;
  out vec4 vColor; out vec2 vOffset;
  void main() {
    vColor = aColor; vOffset = aOffset;
    vec4 viewPos = uView * vec4(aCenter, 1.0);
    viewPos.xy += aOffset * aSize;
    gl_Position = uProj * viewPos;
  }`;
  const PART_FS = `#version 300 es
  precision highp float;
  in vec4 vColor; in vec2 vOffset;
  out vec4 fragColor;
  void main() {
    float d = length(vOffset) * 2.0;
    float a = smoothstep(1.0, 0.25, d);
    fragColor = vec4(vColor.rgb, vColor.a * a);
  }`;

  const POST_VS = `#version 300 es
  layout(location=0) in vec2 aPos;
  out vec2 vUV;
  void main() { vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
  const POST_FS = `#version 300 es
  precision highp float;
  in vec2 vUV;
  uniform sampler2D uTex;
  uniform float uVignette, uSaturation, uExposure, uContrast;
  uniform float uBloom;
  out vec4 fragColor;
  void main() {

    if (fix.isArray) fix.comp[fix.field] = (fix.value || []).map(resolve).filter((x) => x !== null);
    else fix.comp[fix.field] = resolve(fix.value);
  }
  const root = created[0];
  bumpTransformVersion();
  return root;
}

/* ============================ Asset database ============================ */
const WAssets = (() => {
  let materials = new Map();  // path -> material def (plain object with Color instances)
  let prefabs = new Map();    // path -> serialized tree (objs array, oldId-based)
  let scripts = new Map();    // path -> {source}
  let scenes = new Map();     // path -> scene JSON
  let audioClips = new Map(); // path -> {clip: synthName}
  let textures = new Map();   // path -> {tex: rendererTexName}

  function reset() { materials.clear(); prefabs.clear(); scripts.clear(); scenes.clear(); audioClips.clear(); textures.clear(); }

  function defineMaterial(path, def) {
    materials.set(path, {
      name: path.split("/").pop().replace(".mat", ""),
      color: Color.from(def.color || Color.white),
      emission: Color.from(def.emission || Color.black),
      emissionIntensity: def.emissionIntensity ?? 1,
      texture: def.texture || null,
      texScale: def.texScale ?? 1,
      specular: def.specular ?? 0.25,
      specPower: def.specPower ?? 32,
      transparent: !!def.transparent,
      alpha: def.alpha ?? 1,
    });
  }
  function getMaterial(path) { return materials.get(path) || null; }
  function serializeMaterials() {
    const out = {};
    for (const [path, m] of materials) {
      out[path] = {
        color: m.color.toJSON(), emission: m.emission.toJSON(), emissionIntensity: m.emissionIntensity,
        texture: m.texture, texScale: m.texScale, specular: m.specular, specPower: m.specPower,
        transparent: m.transparent, alpha: m.alpha,
      };
    }
    return out;
  }
  function loadMaterials(obj) { materials.clear(); for (const p in obj) defineMaterial(p, obj[p]); }

  return {
    reset,
    materials, prefabs, scripts, scenes, audioClips, textures,
    defineMaterial, getMaterial, serializeMaterials, loadMaterials,
    definePrefab(path, objs) { prefabs.set(path, objs); },
    getPrefab(path) { return prefabs.get(path); },
    defineScript(path, source) { scripts.set(path, { source }); },
    getScript(path) { return scripts.get(path); },
    defineAudioClip(path, synthName) { audioClips.set(path, { clip: synthName }); },
    getAudioClip(path) { return audioClips.get(path); },
    defineTexture(path, texName) { textures.set(path, { tex: texName }); },
    allPaths() {
      return [...materials.keys(), ...prefabs.keys(), ...scripts.keys(), ...scenes.keys(),
        ...audioClips.keys(), ...textures.keys()];
    },
  };
})();

/* ---------------- Animator (procedural locomotion animation) ---------------- */
class Animator extends WComponent {
  constructor() {
    super();
    this._phase = 0; this._squash = 0; this._state = "Idle";
    this._baseScale = null; this._baseLocalPos = null; this._wasGrounded = true;
  }
  onStartRuntime() {
    if (this.model) {
      this._baseScale = this.model.localScale;
      this._baseLocalPos = this.model.localPosition;
    }
  }
  onUpdateRuntime(dt) {
    if (!this.model || !this._baseScale) return;
    const rb = this.gameObject.GetComponent("Rigidbody");
    const vel = rb ? rb.velocity : Vector3.zero;
    const hSpeed = Math.hypot(vel.x, vel.z);
    const grounded = rb ? rb._grounded : true;
    this._state = !grounded ? (vel.y > 0.5 ? "Jump" : "Fall") : (hSpeed > 0.3 ? "Run" : "Idle");
    if (grounded && !this._wasGrounded) this._squash = Math.min(0.35, Math.abs(vel.y) * 0.03 + 0.12);
    this._wasGrounded = grounded;
    this._squash = Mathf.MoveTowards(this._squash, 0, dt * 2.2);
    this._phase += dt * hSpeed * this.bobFrequency;
    const bob = grounded ? Math.abs(Math.sin(this._phase)) * this.bobAmplitude * Math.min(hSpeed / 4, 1) : 0;
    let sy = 1 - this._squash, sxz = 1 + this._squash * 0.6;
    if (!grounded) { sy = 1 + Math.min(0.15, Math.abs(vel.y) * 0.012); sxz = 1 - Math.min(0.1, Math.abs(vel.y) * 0.008); }
    this.model.localScale = new Vector3(this._baseScale.x * sxz, this._baseScale.y * sy, this._baseScale.z * sxz);
    this.model.localPosition = new Vector3(this._baseLocalPos.x, this._baseLocalPos.y + bob, this._baseLocalPos.z);
    const tilt = Mathf.Clamp(hSpeed * this.runTilt, 0, 12);
    this.model.localRotation = Quaternion.Euler(tilt, 0, Math.sin(this._phase) * 2 * Math.min(hSpeed / 4, 1));
  }
  GetState() { return this._state; }
}
