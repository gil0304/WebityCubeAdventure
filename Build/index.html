  constructor(classNames, enums) {
    this.classNames = classNames;
    this.enums = enums;
    this.tempCounter = 0;
  }
  err(msg, node, code = "CS0000") {
    throw new CSError(msg, node?.line || 1, node?.col || 1, code);
  }

  /* ============ class ============ */
  emitClass(cls) {
    this.cls = cls;
    this.fieldNames = new Set();
    this.staticNames = new Set();
    this.methodNames = new Set();
    this.staticMethodNames = new Set();
    this.propNames = new Set();
    for (const m of cls.members) {
      if (m.kind === "Field") {
        for (const d of m.decls) (m.mods.includes("static") || m.mods.includes("const") ? this.staticNames : this.fieldNames).add(d.name);
      } else if (m.kind === "Method") {
        (m.mods.includes("static") ? this.staticMethodNames : this.methodNames).add(m.name);
      } else if (m.kind === "Property") {
        (m.mods.includes("static") ? this.staticNames : this.propNames).add(m.name);
      }
    }
    const isMono = this.isMonoDerived(cls);
    const baseJS = cls.base
      ? (this.classNames.has(cls.base) ? cls.base : "MonoBehaviour")
      : null;

    const lines = [];
    lines.push(`class ${cls.name}${baseJS ? " extends " + baseJS : ""} {`);

    // constructor: field initializers + user ctor
    const ctor = cls.members.find((m) => m.kind === "Method" && m.isCtor);
    const fieldInits = [];
    for (const m of cls.members) {
      if (m.kind === "Field" && !m.mods.includes("static") && !m.mods.includes("const")) {
        for (const d of m.decls) {
          fieldInits.push(`this.${d.name} = ${d.init ? this.emitInitExpr(d.init, m.type) : this.defaultFor(m.type)};`);
        }
      }
      if (m.kind === "Property" && !m.mods.includes("static") && !m.getterBody && !m.getterExpr) {
        fieldInits.push(`this.${m.name} = ${m.init ? this.emitInitExpr(m.init, m.type) : this.defaultFor(m.type)};`);
        this.fieldNames.add(m.name);
        this.propNames.delete(m.name);
      }
    }
    const ctorParams = ctor ? ctor.params.map((p) => p.name).join(", ") : "";
    lines.push(`constructor(${ctorParams}) {`);
    if (baseJS) lines.push("super();");
    lines.push(...fieldInits);
    if (ctor) {
      this.scopes = [new Set(ctor.params.map((p) => p.name))];
      this.currentMethod = ctor;
      lines.push(this.emitBlockInner(ctor.body));
    }
    lines.push("}");

    // methods
    for (const m of cls.members) {
      if (m.kind !== "Method" || m.isCtor) continue;
      this.currentMethod = m;
      this.scopes = [new Set(m.params.map((p) => p.name))];
      const star = m.isCoroutine ? "*" : "";
      const stat = m.mods.includes("static") ? "static " : "";
      const params = m.params.map((p) => p.default ? `${p.name} = ${this.emitExpr(p.default)}` : p.name).join(", ");
      lines.push(`${stat}${star}${m.name}(${params}) {`);
      lines.push(this.emitBlockInner(m.body));
      lines.push("}");
    }
    // bodied properties
    for (const m of cls.members) {
      if (m.kind !== "Property") continue;
      if (m.getterExpr) {
        this.currentMethod = m;
        this.scopes = [new Set()];
        lines.push(`get ${m.name}() { return ${this.emitExpr(m.getterExpr)}; }`);
      } else if (m.getterBody) {
        this.currentMethod = m;
        this.scopes = [new Set()];
        lines.push(`get ${m.name}() {`);
        lines.push(this.emitBlockInner(m.getterBody));
        lines.push("}");
        if (m.setterBody) {
          this.scopes = [new Set(["value"])];
          lines.push(`set ${m.name}(value) {`);
          lines.push(this.emitBlockInner(m.setterBody));
          lines.push("}");
        }
      }
    }
    lines.push("}");
    lines.push(`${cls.name}.__className = ${JSON.stringify(cls.name)};`);
    if (isMono) lines.push(`${cls.name}.__isMono = true;`);

    // static fields / static auto-props
    for (const m of cls.members) {
      if (m.kind === "Field" && (m.mods.includes("static") || m.mods.includes("const"))) {
        this.scopes = [new Set()];
        this.currentMethod = null;
        for (const d of m.decls) {
          lines.push(`${cls.name}.${d.name} = ${d.init ? this.emitInitExpr(d.init, m.type) : this.defaultFor(m.type)};`);
        }
      }
      if (m.kind === "Property" && m.mods.includes("static") && !m.getterBody && !m.getterExpr) {
        this.scopes = [new Set()];
        lines.push(`${cls.name}.${m.name} = ${m.init ? this.emitInitExpr(m.init, m.type) : this.defaultFor(m.type)};`);
      }
    }
    return lines.join("\n");
  }

  isMonoDerived(cls) {
    if (!cls.base) return false;
    if (cls.base === "MonoBehaviour" || cls.base === "Behaviour") return true;
    return true; // any based class in our world acts component-like
  }

  emitInitExpr(init, type) {
    this.scopes = this.scopes || [new Set()];
    if (init.kind === "ArrayInit") return "[" + init.items.map((x) => this.emitExpr(x)).join(", ") + "]";
    return this.emitExpr(init);
  }
  defaultFor(type) {
    if (!type) return "null";
    if (type.arrayDims > 0) return "[]";
    switch (type.name) {
      case "float": case "int": case "double": case "long": case "short": case "byte": case "uint": return "0";
      case "bool": return "false";
      case "string": return '""';
      case "Vector3": return "new Vector3()";
      case "Vector2": return "new Vector2()";
      case "Quaternion": return "Quaternion.identity";
      case "Color": return "Color.white";
      case "List": return "new List()";
      case "LayerMask": return "0";
      default:
        if (this.enums.has(type.name)) return "0";
        return "null";
    }
  }

  /* ============ statements ============ */
  pushScope() { this.scopes.push(new Set()); }
  popScope() { this.scopes.pop(); }
  declareLocal(n) { this.scopes[this.scopes.length - 1].add(n); }
  isLocal(n) { return this.scopes.some((s) => s.has(n)); }

  emitBlockInner(block) {
    this.pushScope();
    // emitStmtNested preserves any prelude collected by an enclosing statement
    const out = block.stmts.map((s) => this.emitStmtNested(s)).join("\n");
    this.popScope();
    return out;
  }

  emitStmt(st) {
    this.prelude = [];
    let code;
    switch (st.kind) {
      case "Block": { code = "{\n" + this.emitBlockInner(st) + "\n}"; break; }
      case "Empty": code = ";"; break;
      case "VarDecl": {
        const parts = [];
        for (const d of st.decls) {
          this.declareLocal(d.name);
          const init = d.init
            ? (d.init.kind === "ArrayInit" ? "[" + d.init.items.map((x) => this.emitExpr(x)).join(", ") + "]" : this.emitExpr(d.init))
            : this.defaultFor(st.type);
          parts.push(`${d.name} = ${init}`);
        }
        code = "let " + parts.join(", ") + ";";
        break;
      }
      case "ExprStmt": code = this.emitExpr(st.expr) + ";"; break;
      case "If": {
        const cond = this.emitExpr(st.cond);
        code = `if (${cond}) ${this.stmtAsBlock(st.then)}`;
        if (st.else) code += ` else ${this.stmtAsBlock(st.else)}`;
        break;
      }
      case "While": code = `while (${this.emitExpr(st.cond)}) ${this.stmtAsBlock(st.body)}`; break;
      case "DoWhile": code = `do ${this.stmtAsBlock(st.body)} while (${this.emitExpr(st.cond)});`; break;
      case "For": {
        this.pushScope();
        let init = "";
        if (st.init) {
          const s = this.emitStmtNested(st.init);
          init = s.endsWith(";") ? s.slice(0, -1) : s;
        }
        const cond = st.cond ? this.emitExpr(st.cond) : "";
        const inc = st.inc ? st.inc.map((e) => this.emitExpr(e)).join(", ") : "";
        const body = this.stmtAsBlock(st.body);
        this.popScope();
        code = `for (${init}; ${cond}; ${inc}) ${body}`;
        break;
      }
      case "Foreach": {
        this.pushScope();
        this.declareLocal(st.varName);
        const coll = this.emitExpr(st.coll);
        const body = this.stmtAsBlock(st.body);
        this.popScope();
        code = `for (const ${st.varName} of CS.iter(${coll})) ${body}`;
        break;
      }
      case "Return": {
        if (this.currentMethod && this.currentMethod.isCoroutine && st.expr)
          this.err("Cannot return a value from an iterator. Use yield return.", st, "CS1622");
        code = st.expr ? `return ${this.emitExpr(st.expr)};` : "return;";
        break;
      }
      case "Break": code = "break;"; break;
      case "Continue": code = "continue;"; break;
      case "YieldReturn": {
        if (!this.currentMethod || !this.currentMethod.isCoroutine)
          this.err("yield return can only be used inside an IEnumerator method", st, "CS1621");
        code = `yield ${st.expr ? this.emitExpr(st.expr) : "null"};`;
        break;
      }
      case "YieldBreak": code = "return;"; break;
      case "Switch": {
        const sw = this.emitExpr(st.expr);
        const parts = [`switch (CS.switchVal(${sw})) {`];
        for (const c of st.cases) {
          for (const lbl of c.labels) {
            parts.push(lbl === null ? "default:" : `case CS.switchVal(${this.emitExpr(lbl)}):`);
          }
          this.pushScope();
          parts.push("{");
          for (const s of c.stmts) parts.push(this.emitStmtNested(s));
          parts.push("}");
          this.popScope();
        }
        parts.push("}");
        code = parts.join("\n");
        break;
      }
      case "Throw": code = st.expr ? `throw CS.makeError(${this.emitExpr(st.expr)});` : "throw new Error('rethrow');"; break;
      case "Try": {
        code = `try {\n${this.emitBlockInner(st.block)}\n}`;
        if (st.catchBlock) {
          this.pushScope();
          if (st.catchVar) this.declareLocal(st.catchVar);
          code += ` catch (${st.catchVar || "__ex"}) {\n${this.emitBlockInner(st.catchBlock)}\n}`;
          this.popScope();
        }
        if (st.finallyBlock) code += ` finally {\n${this.emitBlockInner(st.finallyBlock)}\n}`;
        if (!st.catchBlock && !st.finallyBlock) code += " catch (__ex) { throw __ex; }";
        break;
      }
      default: this.err("Unsupported statement: " + st.kind, st, "CS9001");
    }
    if (this.prelude.length) code = this.prelude.join("\n") + "\n" + code;
    this.prelude = [];
    return code;
  }
  emitStmtNested(st) {
    // preserve outer prelude while emitting nested statement
    const saved = this.prelude;
    const out = this.emitStmt(st);
    this.prelude = saved;
    return out;
  }
  stmtAsBlock(st) {
    if (st.kind === "Block") return "{\n" + this.emitBlockInner(st) + "\n}";
    return "{\n" + this.emitStmtNested(st) + "\n}";
  }

  /* ============ expressions ============ */
  emitExpr(e) {
    switch (e.kind) {
      case "Literal":
        if (e.litType === "str") return JSON.stringify(e.value);
        if (e.litType === "null") return "null";
        return String(e.value);
      case "This": return "this";
      case "Base": return "super";
      case "Paren": return "(" + this.emitExpr(e.expr) + ")";
      case "Ident": return this.emitIdent(e);
      case "Member": return this.emitMember(e);
      case "Index": return `OP.idx(${this.emitExpr(e.obj)}, ${this.emitExpr(e.index)})`;
      case "Call": return this.emitCall(e);
      case "New": return this.emitNew(e);
      case "NewArray": {
        if (e.items) return "[" + e.items.map((x) => x.kind === "ArrayInit" ? this.emitExpr({ kind: "NewArray", type: e.type, items: x.items }) : this.emitExpr(x)).join(", ") + "]";
        const fill = ["float", "int", "double", "long", "byte", "short", "uint"].includes(e.type.name) ? "0" : "null";
        return e.size ? `CS.newArray(${this.emitExpr(e.size)}, ${fill})` : "[]";
      }
      case "Interp": {
        let out = "`";
        for (const p of e.parts) {
          if (p.type === "text") out += p.value.replace(/\\/g, "\\\\").replace(/`/g, "\\`").replace(/\$\{/g, "\\${");
          else out += "${" + (p.fmt ? `OP.fmt(${this.emitExpr(p.expr)}, ${JSON.stringify(p.fmt)})` : `OP.str(${this.emitExpr(p.expr)})`) + "}";
        }
        return out + "`";
      }
      case "Binary": return this.emitBinary(e);
      case "Unary": {
        const x = this.emitExpr(e.operand);
        if (e.op === "!") return `(!OP.bool(${x}))`;
        if (e.op === "-") return `OP.neg(${x})`;
        if (e.op === "~") return `(~${x})`;
        return e.prefix ? `(${e.op}${x})` : `(${x}${e.op})`;
      }
      case "Ternary": return `(OP.bool(${this.emitExpr(e.cond)}) ? ${this.emitExpr(e.then)} : ${this.emitExpr(e.else)})`;
      case "Assign": return this.emitAssign(e);
      case "Cast": {
        const x = this.emitExpr(e.expr);
        if (e.type === "int" || e.type === "long" || e.type === "short" || e.type === "byte" || e.type === "uint") return `OP.int(${x})`;
        if (e.type === "bool") return `OP.bool(${x})`;
        if (e.type === "string") return `OP.str(${x})`;
        return `(${x})`;
      }
      case "Is": {
        const x = this.emitExpr(e.expr);
        if (e.name) {
          this.declareLocal(e.name);
          this.prelude.push(`let ${e.name} = null;`);
          return `((${e.name} = CS.asType(${x}, ${JSON.stringify(e.type.name)})) !== null)`;
        }
        return `CS.isType(${x}, ${JSON.stringify(e.type.name)})`;
      }
      case "As": return `CS.asType(${this.emitExpr(e.expr)}, ${JSON.stringify(e.type.name)})`;
      case "Lambda": {
        this.pushScope();
        for (const p of e.params) this.declareLocal(p);
        const body = e.body.kind === "Block" ? `{ ${this.emitBlockInner(e.body)} }` : this.emitExpr(e.body);
        this.popScope();
        return `((${e.params.join(", ")}) => ${body})`;
      }
      case "ArrayInit": return "[" + e.items.map((x) => this.emitExpr(x)).join(", ") + "]";
      case "OutArg": this.err("out argument is only valid inside a method call", e, "CS1525"); break;
      default: this.err("Unsupported expression: " + e.kind, e, "CS9002");
    }
  }

  emitIdent(e) {
    const n = e.name;
    if (this.isLocal(n)) return n;
    if (this.fieldNames.has(n) || this.methodNames.has(n) || this.propNames.has(n)) return `this.${n}`;
    if (this.staticNames.has(n) || this.staticMethodNames.has(n)) return `${this.cls.name}.${n}`;
    if (CS_BEHAVIOUR_MEMBERS.has(n)) return `this.${n}`;
    if (CS_BEHAVIOUR_METHODS.has(n)) return `this.${n}`;
    if (this.classNames.has(n)) return n;
    if (this.enums.has(n)) return n;
    if (CS_API_GLOBALS.includes(n)) return n;
    if (e.isPrimitiveType) return `CS.primitives.${n}`;
    this.err(`The name '${n}' does not exist in the current context`, e, "CS0103");
  }

  emitMember(e) {
    // enum member: EnumName.Member
    if (e.obj.kind === "Ident" && this.enums.has(e.obj.name) && !this.isLocal(e.obj.name)) {
      return `${e.obj.name}.${e.name}`;
    }
    const obj = this.emitExpr(e.obj);
    if (e.name === "Length" || e.name === "Count") return `OP.len(${obj})`;
    return e.optional ? `${obj}?.${e.name}` : `${obj}.${e.name}`;
  }

  emitCall(e) {
    const callee = e.callee;
    // generic → string type arg
    let injectedArgs = [];
    if (e.typeArgs && e.typeArgs.length) {
      const mname = callee.kind === "Member" ? callee.name : callee.kind === "Ident" ? callee.name : null;
      if (mname && CS_GENERIC_TO_STRING_ARG.has(mname)) {
        injectedArgs = [JSON.stringify(e.typeArgs[0].name)];
      }
    }
    // out args
    const outFixups = [];
    const argStrs = e.args.map((a) => {
      if (a.kind === "OutArg") {
        const tmp = `__out${++this.tempCounter}`;
        this.prelude.push(`let ${tmp} = CS.outBox();`);
        if (a.varType) { this.declareLocal(a.name); this.prelude.push(`let ${a.name} = null;`); }
        else if (!this.isLocal(a.name) && !this.fieldNames.has(a.name)) { this.declareLocal(a.name); this.prelude.push(`let ${a.name} = null;`); }
        outFixups.push({ tmp, name: this.isLocal(a.name) ? a.name : (this.fieldNames.has(a.name) ? "this." + a.name : a.name) });
        return tmp;
      }
      return this.emitExpr(a);
    });
    const allArgs = injectedArgs.concat(argStrs).join(", ");

    let callExpr;
    if (callee.kind === "Member") {
      if (callee.name === "ToString") {
        callExpr = `OP.toStr(${this.emitExpr(callee.obj)}, ${argStrs[0] || "null"})`;
      } else if (callee.name === "Equals" && argStrs.length === 1) {
        callExpr = `OP.eq(${this.emitExpr(callee.obj)}, ${argStrs[0]})`;
      } else if (CS_AMBIGUOUS_METHODS.has(callee.name)) {
        callExpr = `OP.invoke(${this.emitExpr(callee.obj)}, ${JSON.stringify(callee.name)}, [${allArgs}])`;
      } else if (callee.obj.kind === "Ident" && this.enums.has(callee.obj.name)) {
        callExpr = `${callee.obj.name}.${callee.name}(${allArgs})`;
      } else {
        callExpr = `${this.emitExpr(callee.obj)}${callee.optional ? "?." : "."}${callee.name}(${allArgs})`;
      }
    } else if (callee.kind === "Ident") {
      callExpr = `${this.emitIdent(callee)}(${allArgs})`;
    } else if (callee.kind === "Base") {
      this.err("base calls are not supported here", e, "CS9003");
    } else {
      callExpr = `${this.emitExpr(callee)}(${allArgs})`;
    }

    if (outFixups.length) {
      const tmp = `__ret${++this.tempCounter}`;
      this.prelude.push(`let ${tmp};`);
      const fixes = outFixups.map((f) => `${f.name} = ${f.tmp}.v`).join(", ");
      return `(${tmp} = ${callExpr}, ${fixes}, ${tmp})`;
    }
    return callExpr;
  }

  emitNew(e) {
    const tname = e.type.name;
    if (tname === "List") {
      const items = e.items ? "[" + e.items.map((x) => this.emitExpr(x)).join(", ") + "]" : "";
      return `new List(${items})`;
    }
    if (tname === "Dictionary") return "new Dictionary()";
    const args = e.args.map((a) => this.emitExpr(a)).join(", ");
    if (this.classNames.has(tname)) return `new ${tname}(${args})`;
    if (this.enums.has(tname)) this.err(`Cannot create an instance of enum '${tname}'`, e, "CS1955");
    if (CS_API_GLOBALS.includes(tname)) return `new ${tname}(${args})`;
    this.err(`The type or namespace name '${tname}' could not be found`, e, "CS0246");
  }

  emitBinary(e) {
    const l = this.emitExpr(e.l), r = this.emitExpr(e.r);
    switch (e.op) {
      case "+": return `OP.add(${l}, ${r})`;
      case "-": return `OP.sub(${l}, ${r})`;
      case "*": return `OP.mul(${l}, ${r})`;
      case "/": return `OP.div(${l}, ${r})`;
      case "%": return `(${l} % ${r})`;
      case "==": return `OP.eq(${l}, ${r})`;
      case "!=": return `OP.ne(${l}, ${r})`;
      case "&&": return `(OP.bool(${l}) && OP.bool(${r}))`;
      case "||": return `(OP.bool(${l}) || OP.bool(${r}))`;
      case "??": return `(${l} ?? ${r})`;
      default: return `(${l} ${e.op} ${r})`;
    }
  }

  emitAssign(e) {
    const t = e.target;
    const opMap = { "+=": "add", "-=": "sub", "*=": "mul", "/=": "div", "%=": "mod" };
    if (t.kind === "Index") {
      const obj = this.emitExpr(t.obj), idx = this.emitExpr(t.index);
      if (e.op === "=") return `OP.setIdx(${obj}, ${idx}, ${this.emitExpr(e.value)})`;
      const fn = opMap[e.op];
      if (fn) return `OP.setIdx(${obj}, ${idx}, OP.${fn}(OP.idx(${obj}, ${idx}), ${this.emitExpr(e.value)}))`;
      return `OP.setIdx(${obj}, ${idx}, OP.idx(${obj}, ${idx}) ${e.op.slice(0, -1)} ${this.emitExpr(e.value)})`;
    }
    const target = this.emitExpr(t);
    if (e.op === "=") return `(${target} = ${this.emitExpr(e.value)})`;
    if (e.op === "??=") return `(${target} = ${target} ?? ${this.emitExpr(e.value)})`;
    const fn = opMap[e.op];
    if (fn) return `(${target} = OP.${fn}(${target}, ${this.emitExpr(e.value)}))`;
    return `(${target} ${e.op} ${this.emitExpr(e.value)})`; // |=, &=, ^=
  }
}

/* ============ field metadata extraction (for Inspector) ============ */
function csExtractFieldMeta(cls, enums, classNames) {
  const fields = [];
  for (const m of cls.members) {
    if (m.kind !== "Field") continue;
    if (m.mods.includes("static") || m.mods.includes("const")) continue;
    const isPublic = m.mods.includes("public");
    const hasSerializeField = (m.attrs || []).some((a) => a.name === "SerializeField");
    const hidden = (m.attrs || []).some((a) => a.name === "HideInInspector" || a.name === "System" );
    if ((!isPublic && !hasSerializeField) || hidden) continue;
    const header = (m.attrs || []).find((a) => a.name === "Header");
    const range = (m.attrs || []).find((a) => a.name === "Range");
    const t = m.type;
    let ftype = null, extra = {};
    if (t.arrayDims > 0 || t.name === "List") {
      const elem = t.arrayDims > 0 ? t.name : (t.args && t.args[0] ? t.args[0].name : "object");
      if (CS_REF_TYPES.has(elem) || classNames.has(elem)) {
        ftype = "objectRefArray"; extra.refKind = elem; extra.isList = t.name === "List";
      } else continue;
    } else {
      switch (t.name) {
        case "float": case "double": ftype = "float"; break;
        case "int": case "long": case "short": case "byte": case "uint": ftype = "int"; break;
        case "bool": ftype = "bool"; break;
        case "string": ftype = "string"; break;
        case "Vector3": ftype = "vector3"; break;
        case "Color": ftype = "color"; break;
        case "LayerMask": ftype = "layer"; break;
        case "KeyCode": ftype = "string"; break;
        case "AudioClip": ftype = "asset"; extra.assetKind = "audio"; break;
        case "Material": ftype = "asset"; extra.assetKind = "material"; break;
        default:

      try {
        const ast = csParse(rec.source);

      } catch (e) {
        if (e instanceof CSError) {

  function defaultForType(f) {
    switch (f.type) {
      case "float": case "int": case "layer": return 0;
      case "bool": return false;
      case "string": return "";
      case "vector3": return new Vector3();
      case "color": return Color.white;
      case "enum": return 0;

    }

  function hasClass(name) { return !!(build && build.classes[name] && build.classes[name].__isMono); }
  function allScriptClassNames() {
    return build ? Object.keys(build.classes).filter((n) => build.classes[n].__isMono) : [];
  }
  function meta(name) { return build ? build.metaByClass[name] || null : null; }
  function createScriptComponent(name) {
    if (!hasClass(name)) return null;
    try {
      return new build.classes[name]();
    } catch (e) {
      CSApi.ctx.log("error", `${name}: constructor threw: ${e.message}`);
      return null;
    }
  }
  function createStub(className, rawProps) { return new MissingScriptStub(className, rawProps); }

  return {
    compileAll, hasClass, meta, createScriptComponent, createStub, allScriptClassNames,
    get lastErrors() { return lastErrors; },
    get hasBuild() { return !!build; },
    get compileCount() { return compileCount; },
    get moduleSrc() { return build ? build.moduleSrc : ""; },
    getEnum(name) { return build ? build.enums[name] : null; },
  };
})();


/* ==== js/runtime/game.js ==== */
/* Webity runtime — play-mode world lifecycle, script scheduling, physics events, rendering helpers */
"use strict";

const WRuntime = (() => {
  let scene = null;
  let playing = false;
  let paused = false;
  let coroutines = [];
  let invokes = [];
  let destroyQueue = [];
  let pendingStart = [];
  let fixedAccum = 0;
  let reloadRequest = false;
  let startSnapshot = null;
  let errorStreak = new Map(); // "Class.Method" -> count (avoid console flood is handled by console collapse)

  const Time = CSApi.api.Time;

  function isScript(c) { return c.typeName === "CSScript" && !c.__isMissingStub; }
  function activeScripts() {
    const out = [];
    if (!scene) return out;
    for (const go of scene.iterate()) {
      if (!go.activeInHierarchy) continue;
      for (const c of go.components) {
        if (!c.__destroyed && isScript(c) && c.enabled) out.push(c);
      }
    }
    return out;
  }
  function callSafe(comp, method, arg) {
    const fn = comp[method];
    if (typeof fn !== "function") return;
    try {
      fn.call(comp, arg);
    } catch (e) {
      const key = `${comp.className}.${method}`;
      CSApi.ctx.log("error", `${e.constructor === Error ? "Exception" : (e.name || "Exception")}: ${e.message}\n  at ${key} ()`);
      errorStreak.set(key, (errorStreak.get(key) || 0) + 1);
    }
  }

  function awakenTree(go) {
    // Awake + OnEnable for all script comps under an active GO
    if (!go.activeInHierarchy) return;
    for (const target of subtree(go)) {
      if (!target.activeInHierarchy) continue;
      for (const c of [...target.components]) {
        if (c.__destroyed) continue;
        if (isScript(c)) {
          if (!c.__awoken) { c.__awoken = true; callSafe(c, "Awake"); }
          if (c.enabled && !c.__enabledFired) { c.__enabledFired = true; callSafe(c, "OnEnable"); }
          if (c.enabled && !c.__started) pendingStart.push(c);
        } else if (typeof c.onStartRuntime === "function" && !c.__runtimeStarted) {
          c.__runtimeStarted = true;
          try { c.onStartRuntime(); } catch (e) { /* builtin */ }
        }
      }
    }
  }
  function* subtree(go) {
    yield go;
    for (const ch of go.transform.children) yield* subtree(ch.gameObject);
  }

  function start(sceneData) {
    stop();
    startSnapshot = sceneData;
    scene = WScene.deserialize(sceneData);
    scene.playing = true;
    scene.runtime = api;
    CSApi.ctx.scene = scene;
    CSApi.ctx.runtime = api;
    Time._reset();
    Time.fixedDeltaTime = scene.settings.fixedTimestep;
    WPhysics.resetState();
    coroutines = []; invokes = []; destroyQueue = []; pendingStart = [];
    fixedAccum = 0; reloadRequest = false;
    playing = true; paused = false;
    for (const go of [...scene.roots]) awakenTree(go);
    flushStarts();
    return scene;
  }

  function stop() {
    if (scene) {
      for (const c of activeScripts()) callSafe(c, "OnDestroy");
      scene.playing = false;
      scene.runtime = null;
    }
    WAudio.stopAll();
    playing = false; paused = false;
    scene = null;
    CSApi.ctx.scene = null;
    CSApi.ctx.runtime = null;
    coroutines = []; invokes = []; destroyQueue = []; pendingStart = [];
  }

  function flushStarts() {
    while (pendingStart.length) {
      const batch = pendingStart;
      pendingStart = [];
      for (const c of batch) {
        if (c.__destroyed || c.__started) continue;
        if (!c.enabled || !c.gameObject || !c.gameObject.activeInHierarchy) { pendingStart.push(c); continue; }
        c.__started = true;
        callSafe(c, "Start");
      }
      if (pendingStart.length && pendingStart.every((c) => !c.enabled || !c.gameObject.activeInHierarchy)) break;
    }
  }

  function dispatchPhysicsEvents(events) {
    const map = {
      TriggerEnter: "OnTriggerEnter", TriggerStay: "OnTriggerStay", TriggerExit: "OnTriggerExit",
      CollisionEnter: "OnCollisionEnter", CollisionStay: "OnCollisionStay", CollisionExit: "OnCollisionExit",
    };
    for (const ev of events) {
      if (ev.target.__destroyed) continue;
      const method = map[ev.type];
      for (const c of [...ev.target.components]) {
        if (!c.__destroyed && isScript(c) && c.enabled) callSafe(c, method, ev.arg);
      }
    }
  }

  function doFixedStep(fdt) {
    for (const c of activeScripts()) callSafe(c, "FixedUpdate");
    const events = [];
    WPhysics.step(scene, fdt, events);
    dispatchPhysicsEvents(events);
  }

  function advanceCoroutines() {
    for (const co of [...coroutines]) {
      if (co.done) continue;
      if (co.behaviour.__destroyed || !co.behaviour.gameObject || co.behaviour.gameObject.__destroyed) { co.done = true; continue; }
      if (co.waitUntil !== null && Time.time < co.waitUntil) continue;
      if (co.waitRealUntil !== null && Time.unscaledTime < co.waitRealUntil) continue;
      if (co.waitCoroutine && !co.waitCoroutine.done) continue;
      co.waitUntil = null; co.waitRealUntil = null; co.waitCoroutine = null;
      let r;
      try {
        r = co.it.next();
      } catch (e) {
        CSApi.ctx.log("error", `Exception in coroutine (${co.behaviour.className}): ${e.message}`);
        co.done = true;
        continue;
      }
      if (r.done) { co.done = true; continue; }
      const v = r.value;
      if (v === null || v === undefined) continue;
      if (v instanceof CSApi.api.WaitForSeconds) co.waitUntil = Time.time + v.seconds;
      else if (v instanceof CSApi.api.WaitForSecondsRealtime) co.waitRealUntil = Time.unscaledTime + v.seconds;
      else if (v && typeof v.next === "function") {
        const child = { behaviour: co.behaviour, it: v, waitUntil: null, waitRealUntil: null, waitCoroutine: null, done: false };
        coroutines.push(child);
        co.waitCoroutine = child;
      } else if (v && v.__isCoroutineHandle) {
        co.waitCoroutine = v;
      }
    }
    coroutines = coroutines.filter((c) => !c.done);
  }

  function advanceInvokes() {
    for (const inv of [...invokes]) {
      if (inv.cancelled || inv.behaviour.__destroyed) { inv.done = true; continue; }
      if (Time.time >= inv.at) {
        callSafe(inv.behaviour, inv.method);
        if (inv.repeat > 0) inv.at += inv.repeat;
        else inv.done = true;
      }
    }
    invokes = invokes.filter((i) => !i.done);
  }

  function processDestroyQueue() {
    for (const d of [...destroyQueue]) {
      if (Time.time < d.at) continue;
      d.done = true;
      const obj = d.obj;
      if (!obj || obj.__destroyed) continue;
      if (obj instanceof WGameObject) {
        scene.destroyObject(obj);
      } else if (obj.gameObject) {
        if (isScript(obj)) { callSafe(obj, "OnDisable"); callSafe(obj, "OnDestroy"); }
        obj.gameObject.removeComponent(obj);
      }
    }
    destroyQueue = destroyQueue.filter((d) => !d.done);
  }

  function tick(dtReal) {
    if (!playing || paused || !scene) return;
    frameCore(Math.min(dtReal, 0.1));
  }
  function stepOneFrame() {
    if (!playing || !scene) return;
    frameCore(scene.settings.fixedTimestep, true);
  }
  function frameCore(dtReal, forceFixed = false) {
    Time.unscaledDeltaTime = dtReal;
    Time.unscaledTime += dtReal;
    Time.realtimeSinceStartup += dtReal;
    const scaled = dtReal * Time.timeScale;
    Time.deltaTime = scaled;
    Time.time += scaled;
    Time.frameCount++;

    flushStarts();

    fixedAccum += scaled;
    const fdt = scene.settings.fixedTimestep;
    let steps = 0;
    if (forceFixed) { doFixedStep(fdt); fixedAccum = 0; }
    else {
      while (fixedAccum >= fdt && steps < 5) { doFixedStep(fdt); fixedAccum -= fdt; steps++; }
      if (steps === 5) fixedAccum = 0;
    }

    for (const c of activeScripts()) callSafe(c, "Update");
    // builtin per-frame behaviours
    for (const go of scene.iterate()) {
      if (!go.activeInHierarchy) continue;
      for (const c of go.components) {
        if (!c.__destroyed && c.enabled && typeof c.onUpdateRuntime === "function") {
          try { c.onUpdateRuntime(scaled); } catch (e) { /* builtin */ }
        }
      }
    }
    advanceCoroutines();
    advanceInvokes();
    for (const c of activeScripts()) callSafe(c, "LateUpdate");
    processDestroyQueue();
    WParticles.update(scene, scaled);

    if (reloadRequest) {
      reloadRequest = false;
      const snap = startSnapshot;
      start(snap);
    }
  }

  const api = {
    start, stop, tick, stepOneFrame,
    get scene() { return scene; },
    get playing() { return playing; },
    get paused() { return paused; },
    set paused(v) { paused = v; WAudio.setBgmPaused(v); },
    requestReload() { reloadRequest = true; },

    /* engine callbacks */
    notifyDestroy(go) {
      for (const t of subtree(go)) {
        for (const c of t.components) {
          if (!c.__destroyed && isScript(c)) {
            if (c.enabled && t.activeInHierarchy) callSafe(c, "OnDisable");
            callSafe(c, "OnDestroy");
          }
        }
      }
    },
    notifyActiveChanged(go, nowActive) {
      for (const t of subtree(go)) {
        for (const c of t.components) {
          if (c.__destroyed || !isScript(c)) continue;
          if (nowActive && t.activeInHierarchy) {
            if (!c.__awoken) { c.__awoken = true; callSafe(c, "Awake"); }
            if (c.enabled) { c.__enabledFired = true; callSafe(c, "OnEnable"); if (!c.__started) pendingStart.push(c); }
          } else if (!nowActive) {
            if (c.enabled && c.__enabledFired) { c.__enabledFired = false; callSafe(c, "OnDisable"); }
          }
        }
      }
    },
    initComponentLate(comp) {
      if (!isScript(comp)) {
        if (typeof comp.onStartRuntime === "function") { comp.__runtimeStarted = true; try { comp.onStartRuntime(); } catch (e) {} }
        return;
      }
      if (!comp.__awoken) { comp.__awoken = true; callSafe(comp, "Awake"); }
      if (comp.enabled) { comp.__enabledFired = true; callSafe(comp, "OnEnable"); pendingStart.push(comp); }
    },
    initTree(go) { awakenTree(go); },

    addCoroutine(behaviour, it) {
      const handle = { behaviour, it, waitUntil: null, waitRealUntil: null, waitCoroutine: null, done: false, __isCoroutineHandle: true };
      coroutines.push(handle);
      return handle;
    },
    stopCoroutine(behaviour, handle) {
      if (handle && handle.__isCoroutineHandle) handle.done = true;
    },
    stopAllCoroutines(behaviour) {
      for (const co of coroutines) if (co.behaviour === behaviour) co.done = true;
    },
    addInvoke(behaviour, method, t, repeat) {
      invokes.push({ behaviour, method, at: Time.time + t, repeat: repeat || 0 });
    },
    cancelInvoke(behaviour, method) {
      for (const i of invokes) if (i.behaviour === behaviour && (!method || i.method === method)) i.cancelled = true;
    },
    isInvoking(behaviour, method) {
      return invokes.some((i) => i.behaviour === behaviour && (!method || i.method === method) && !i.cancelled);
    },
    scheduleDestroy(obj, delay) {
      destroyQueue.push({ obj: obj && obj.__isCoroutineHandle ? null : obj, at: Time.time + (delay || 0) });
      if (delay <= 0) processDestroyQueue();
    },
    sendMessage(go, method, arg) {
      if (!go || go.__destroyed || !method) return;
      for (const c of [...go.components]) {
        if (!c.__destroyed && isScript(c) && c.enabled) callSafe(c, method, arg);
      }
    },
    handleUIButton(comp) {
      if (!playing) return;
      WAudio.play("click", 0.7);
      const target = comp.onClickTarget || comp.gameObject;
      if (comp.onClickMessage) api.sendMessage(target, comp.onClickMessage);
    },
  };
  return api;
})();

/* ============ shared rendering helpers (editor + built game) ============ */
const WRender = (() => {
  function buildDrawList(scene) {
    const items = [];
    for (const go of scene.iterate()) {
      if (!go.activeInHierarchy) continue;
      const mf = go.GetComponent("MeshFilter");
      const mr = go.GetComponent("MeshRenderer");
      if (!mf || !mr || !mr.enabled || !mf.enabled) continue;
      const mat = mr.resolveMaterial();
      const mesh = MeshLib.get(mf.mesh || "Cube");
      const em = Color.from(mat.emission);
      const ei = mat.emissionIntensity ?? 1;
      items.push({
        mesh,
        matrix: go.transform.worldMatrix,
        color: [mat.color.r, mat.color.g, mat.color.b, mat.transparent ? mat.alpha : 1],
        emission: [em.r * ei, em.g * ei, em.b * ei],
        texture: mat.texture, texScale: mat.texScale,
        specular: mat.specular, specPower: mat.specPower,
        transparent: mat.transparent,
        castShadow: mr.castShadows !== false,
        receiveShadow: mr.receiveShadows !== false,
        worldPos: go.transform.position,
        gameObject: go,
      });
    }
    return items;
  }

  function envParams(scene) {
    let lightDir = new Vector3(-0.4, -0.85, 0.35).normalized;
    let lightColor = [1, 0.956, 0.89];
    let intensity = 1;
    const lights = scene.findComponents("Light");
    if (lights.length) {
      const L = lights[0];
      lightDir = L.transform.forward;
      const c = Color.from(L.color);
      intensity = L.intensity ?? 1;
      lightColor = [c.r * intensity, c.g * intensity, c.b * intensity];
    }
    const pp = scene.findComponents("PostProcessVolume")[0] || null;
    const col = (c, d) => { const x = pp ? Color.from(pp[c]) : d; return [x.r, x.g, x.b]; };
    return {
      lightDir: [-lightDir.x, -lightDir.y, -lightDir.z],
      lightColor,
      skyTop: col("skyTop", new Color(0.28, 0.48, 0.78)),
      skyHorizon: col("skyHorizon", new Color(0.74, 0.82, 0.92)),
      skyBottom: col("skyBottom", new Color(0.24, 0.22, 0.25)),
      ambientSky: col("ambientSky", new Color(0.42, 0.47, 0.55)),
      ambientGround: col("ambientGround", new Color(0.22, 0.2, 0.19)),
      fogColor: pp ? [Color.from(pp.fogColor).r, Color.from(pp.fogColor).g, Color.from(pp.fogColor).b, 1] : [0.68, 0.76, 0.88, 1],
      fogDensity: pp ? pp.fogDensity : 0.008,
      shadows: !lights.length || lights[0].shadows !== false,
    };
  }

  function postParams(scene) {
    const pp = scene.findComponents("PostProcessVolume")[0];
    if (!pp || !pp.enabled) return { vignette: 0, saturation: 1, exposure: 1, contrast: 1, bloom: 0 };
    return {
      vignette: pp.vignette, saturation: pp.saturation, exposure: pp.exposure,
      contrast: pp.contrast, bloom: pp.bloom,
    };
  }

  function cameraParams(camComp, aspect) {
    const t = camComp.transform;
    const world = Matrix4.TRS(t.position, t.rotation, Vector3.one);
    return {
      view: world.invert(),
      proj: Matrix4.Perspective(camComp.fov || 60, aspect, camComp.nearClip || 0.1, camComp.farClip || 300),
      pos: t.position,
    };
  }

  function mainCamera(scene) {
    const go = scene.findWithTag("MainCamera");
    if (go) { const c = go.GetComponent("Camera"); if (c && c.enabled) return c; }
    const cams = scene.findComponents("Camera");
    return cams[0] || null;
  }

  function shadowFocus(drawList) {
    if (!drawList.length) return { focus: new Vector3(), extent: 40 };
    const min = new Vector3(Infinity, Infinity, Infinity), max = new Vector3(-Infinity, -Infinity, -Infinity);
    for (const it of drawList) {
      const p = it.worldPos;
      min.x = Math.min(min.x, p.x); min.y = Math.min(min.y, p.y); min.z = Math.min(min.z, p.z);
      max.x = Math.max(max.x, p.x); max.y = Math.max(max.y, p.y); max.z = Math.max(max.z, p.z);
    }
    const focus = min.add(max).mul(0.5);
    const extent = Math.max(20, Math.min(70, max.sub(min).magnitude * 0.6 + 10));
    return { focus, extent };
  }

  return { buildDrawList, envParams, postParams, cameraParams, mainCamera, shadowFocus };
})();

 PlayerController : MonoBehaviour\n{\n    [Header(\"Movement\")]\n    public float moveSpeed = 6f;\n    public float dashSpeed = 10f;\n    public float jumpForce = 8f;\n    [Range(0f, 1f)]\n    public float airControl = 0.4f;\n    public float rotationSpeed = 12f;\n\n    [Header(\"Ground Check\")]\n    public Transform groundCheck;\n    public float groundRadius = 0.34f;\n    public LayerMask groundLayer;\n\n    [Header(\"References\")]\n    public Transform cameraTransform;\n\n    [Header(\"Abilities\")]\n    public bool enableDoubleJump = true;\n\n    private Rigidbody rb;\n    private bool isGrounded;\n    private bool wasGrounded = true;\n    private bool canDoubleJump;\n    private float inputX;\n    private float inputZ;\n    private bool jumpQueued;\n    private bool dashing;\n\n    void Awake()\n    {\n        rb = GetComponent<Rigidbody>();\n    }\n\n    void Update()\n    {\n        if (Input.GetKeyDown(KeyCode.R) && GameManager.Instance != null)\n        {\n            GameManager.Instance.RestartGame();\n            return;\n        }\n\n        if (GameManager.Instance != null && !GameManager.Instance.IsPlaying())\n        {\n            inputX = 0f;\n            inputZ = 0f;\n            return;\n        }\n\n        inputX = Input.GetAxis(\"Horizontal\");\n        inputZ = Input.GetAxis(\"Vertical\");\n        dashing = Input.GetButton(\"Dash\");\n\n        if (Input.GetButtonDown(\"Jump\"))\n        {\n            jumpQueued = true;\n        }\n    }\n\n    void FixedUpdate()\n    {\n        isGrounded = Physics.CheckSphere(groundCheck.position, groundRadius, groundLayer);\n\n        if (isGrounded && !wasGrounded)\n        {\n            AudioManager.Instance.Play(\"land\");\n        }\n        wasGrounded = isGrounded;\n\n        Vector3 moveDir = ComputeMoveDirection();\n        float targetSpeed = dashing ? dashSpeed : moveSpeed;\n        Vector3 desired = moveDir * targetSpeed;\n\n        Vector3 velocity = rb.velocity;\n        float control = isGrounded ? 0.55f : airControl * 0.35f;\n        velocity.x = Mathf.Lerp(velocity.x, desired.x, control);\n        velocity.z = Mathf.Lerp(velocity.z, desired.z, control);\n\n        if (jumpQueued)\n        {\n            if (isGrounded)\n            {\n                velocity.y = jumpForce;\n                canDoubleJump = enableDoubleJump;\n                AudioManager.Instance.Play(\"jump\");\n            }\n            else if (canDoubleJump)\n            {\n                velocity.y = jumpForce * 0.92f;\n                canDoubleJump = false;\n                AudioManager.Instance.Play(\"doublejump\");\n            }\n        }\n        jumpQueued = false;\n\n        rb.velocity = velocity;\n\n        Vector3 flat = new Vector3(moveDir.x, 0f, moveDir.z);\n        if (flat.sqrMagnitude > 0.001f)\n        {\n            Quaternion targetRot = Quaternion.LookRotation(flat.normalized);\n            transform.rotation = Quaternion.Slerp(\n                transform.rotation, targetRot, rotationSpeed * Time.fixedDeltaTime);\n        }\n    }\n\n    private Vector3 ComputeMoveDirection()\n    {\n        Vector3 forward = Vector3.forward;\n        Vector3 right = Vector3.right;\n        if (cameraTransform != null)\n        {\n            forward = Vector3.ProjectOnPlane(cameraTransform.forward, Vector3.up).normalized;\n            right = Vector3.ProjectOnPlane(cameraTransform.right, Vector3.up).normalized;\n        }\n        Vector3 dir = forward * inputZ + right * inputX;\n        if (dir.sqrMagnitude > 1f) dir = dir.normalized;\n        return dir;\n    }\n\n    public bool IsGrounded()\n    {\n        return isGrounded;\n    }\n}\n"},"Assets/Scripts/Player/PlayerHealth.cs":{"source":"using UnityEngine;\nusing System.Collections;\n\npublic class PlayerHealth : MonoBehaviour\n{\n    public int maxLives = 3;\n    public float invincibleTime = 1.5f;\n    public Transform modelRoot;\n\n    private int currentLives;\n    private float invincibleUntil;\n    private Rigidbody rb;\n\n    void Awake()\n    {\n        rb = GetComponent<Rigidbody>();\n        currentLives = maxLives;\n    }\n\n    public int GetLives()\n    {\n        return currentLives;\n    }\n\n    public void TakeDamage(int amount)\n    {\n        if (Time.time < invincibleUntil) return;\n        if (GameManager.Instance != null && !GameManager.Instance.IsPlaying()) return;\n\n        currentLives = currentLives - amount;\n        invincibleUntil = Time.time + invincibleTime;\n        AudioManager.Instance.Play(\"damage\");\n        GameManager.Instance.OnPlayerDamaged(currentLives);\n\n        if (currentLives <= 0)\n        {\n            GameManager.Instance.GameOver(\"NO LIVES LEFT\");\n        }\n        else\n        {\n            StartCoroutine(BlinkRoutine());\n        }\n    }\n\n    public void Respawn(Vector3 position)\n    {\n        rb.velocity = Vector3.zero;\n        transform.position = position;\n        invincibleUntil = Time.time + 1f;\n    }\n\n    void OnTriggerEnter(Collider other)\n    {\n        if (other.CompareTag(\"KillZone\"))\n        {\n            GameManager.Instance.OnPlayerFell();\n        }\n        else if (other.CompareTag(\"Checkpoint\"))\n        {\n            GameManager.Instance.SetCheckpoint(other.transform.position);\n            AudioManager.Instance.Play(\"checkpoint\");\n            MeshRenderer mr = other.GetComponent<MeshRenderer>();\n            if (mr != null)\n            {\n                mr.material.SetColor(\"_EmissionColor\", Color.green);\n            }\n        }\n    }\n\n    IEnumerator BlinkRoutine()\n    {\n        MeshRenderer rend = null;\n        if (modelRoot != null)\n        {\n            rend = modelRoot.gameObject.GetComponentInChildren<MeshRenderer>();\n        }\n        if (rend == null) yield break;\n\n        for (int i = 0; i < 9; i++)\n        {\n            rend.enabled = !rend.enabled;\n            yield return new WaitForSeconds(0.09f);\n        }\n        rend.enabled = true;\n    }\n}\n"},"Assets/Scripts/Player/PlayerCollector.cs":{"source":"using UnityEngine;\n\npublic class PlayerCollector : MonoBehaviour\n{\n    public ParticleSystem collectEffect;\n\n    private int collected;\n\n    public int GetCollected()\n    {\n        return collected;\n    }\n\n    public void Collect(CollectibleItem item)\n    {\n        collected = collected + 1;\n        AudioManager.Instance.Play(\"collect\");\n        if (collectEffect != null)\n        {\n            collectEffect.Emit(26);\n        }\n        GameManager.Instance.OnCrystalCollected(collected);\n    }\n}\n"},"Assets/Scripts/Camera/FollowCamera.cs":{"source":"using UnityEngine;\n\npublic class FollowCamera : MonoBehaviour\n{\n    public Transform target;\n    public float distance = 7f;\n    public float height = 3.5f;\n    public float followSpeed = 8f;\n    public float rotationSpeed = 4f;\n    public LayerMask collisionMask;\n\n    private float yaw;\n\n    void Start()\n    {\n        if (target != null)\n        {\n            Vector3 offset = transform.position - target.position;\n            if (offset.sqrMagnitude > 0.01f)\n            {\n                yaw = Mathf.Atan2(-offset.x, -offset.z) * Mathf.Rad2Deg;\n            }\n        }\n    }\n\n    void LateUpdate()\n    {\n        if (target == null) return;\n\n        float targetYaw = target.eulerAngles.y;\n        yaw = Mathf.LerpAngle(yaw, targetYaw, rotationSpeed * Time.deltaTime);\n\n        Quaternion rot = Quaternion.Euler(0f, yaw, 0f);\n        Vector3 back = rot * new Vector3(0f, 0f, -1f);\n        Vector3 desired = target.position + back * distance + Vector3.up * height;\n\n        Vector3 castDir = (desired - target.position).normalized;\n        float castDist = Vector3.Distance(desired, target.position);\n        if (Physics.Raycast(target.position, castDir, out RaycastHit hit, castDist, collisionMask))\n        {\n            desired = target.position + castDir * Mathf.Max(hit.distance - 0.3f, 1.2f);\n        }\n\n        transform.position = Vector3.Lerp(\n            transform.position, desired, followSpeed * Time.deltaTime);\n\n        Vector3 lookPoint = target.position + Vector3.up * 0.6f;\n        transform.rotation = Quaternion.LookRotation(lookPoint - transform.position);\n    }\n}\n"},"Assets/Scripts/Obstacles/RotatingObstacle.cs":{"source":"using UnityEngine;\n\npublic enum RotationAxis { X, Y, Z }\n\npublic class RotatingObstacle : MonoBehaviour\n{\n    public RotationAxis rotationAxis = RotationAxis.Y;\n    public float rotationSpeed = 90f;\n    public bool reverse = false;\n\n    void Update()\n    {\n        float dir = reverse ? -1f : 1f;\n        float amount = rotationSpeed * dir * Time.deltaTime;\n\n        if (rotationAxis == RotationAxis.X)\n        {\n            transform.Rotate(amount, 0f, 0f);\n        }\n        else if (rotationAxis == RotationAxis.Y)\n        {\n            transform.Rotate(0f, amount, 0f);\n        }\n        else\n        {\n            transform.Rotate(0f, 0f, amount);\n        }\n    }\n}\n"},"Assets/Scripts/Obstacles/MovingPlatform.cs":{"source":"using UnityEngine;\n\npublic class MovingPlatform : MonoBehaviour\n{\n    public Transform pointA;\n    public Transform pointB;\n    public float moveSpeed = 3f;\n    public float waitTime = 1f;\n    public bool easeMovement = true;\n\n    private Rigidbody rb;\n    private float progress;\n    private int direction = 1;\n    private float waitUntil;\n\n    void Awake()\n    {\n        rb = GetComponent<Rigidbody>();\n    }\n\n    void FixedUpdate()\n    {\n        if (pointA == null || pointB == null) return;\n        if (Time.time < waitUntil) return;\n\n        float length = Vector3.Distance(pointA.position, pointB.position);\n        if (length < 0.01f) return;\n\n        progress = progress + (moveSpeed / length) * direction * Time.fixedDeltaTime;\n        if (progress >= 1f)\n        {\n            progress = 1f;\n            direction = -1;\n            waitUntil = Time.time + waitTime;\n        }\n        else if (progress <= 0f)\n        {\n            progress = 0f;\n            direction = 1;\n            waitUntil = Time.time + waitTime;\n        }\n\n        float t = progress;\n        if (easeMovement) t = Mathf.SmoothStep(0f, 1f, progress);\n        rb.MovePosition(Vector3.Lerp(pointA.position, pointB.position, t));\n    }\n}\n"},"Assets/Scripts/Obstacles/FallingFloor.cs":{"source":"using UnityEngine;\nusing System.Collections;\n\npublic class FallingFloor : MonoBehaviour\n{\n    public float fallDelay = 1.2f;\n    public float respawnDelay = 4f;\n    public float shakeDuration = 0.8f;\n    public float shakeAmount = 0.05f;\n\n    private Vector3 startPos;\n    private bool triggered;\n    private Rigidbody rb;\n\n    void Awake()\n    {\n        rb = GetComponent<Rigidbody>();\n        startPos = transform.position;\n    }\n\n    void OnCollisionEnter(Collision collision)\n    {\n        if (triggered) return;\n        if (!collision.gameObject.CompareTag(\"Player\")) return;\n        triggered = true;\n        StartCoroutine(FallSequence());\n    }\n\n    IEnumerator FallSequence()\n    {\n        AudioManager.Instance.Play(\"falling_floor\");\n\n        float waitBeforeShake = fallDelay - shakeDuration;\n        if (waitBeforeShake > 0f)\n        {\n            yield return new WaitForSeconds(waitBeforeShake);\n        }\n\n        float elapsed = 0f;\n        while (elapsed < shakeDuration)\n        {\n            elapsed = elapsed + Time.deltaTime;\n            float ox = Random.Range(-shakeAmount, shakeAmount);\n            float oz = Random.Range(-shakeAmount, shakeAmount);\n            rb.MovePosition(startPos + new Vector3(ox, 0f, oz));\n            yield return null;\n        }\n\n        float fallSpeed = 0f;\n        float fallen = 0f;\n        while (fallen < 14f)\n        {\n            fallSpeed = fallSpeed + 22f * Time.deltaTime;\n            fallen = fallen + fallSpeed * Time.deltaTime;\n            rb.MovePosition(startPos + Vector3.down * fallen);\n            yield return null;\n        }\n\n        gameObject.SetActive(false);\n        yield return new WaitForSeconds(respawnDelay);\n        transform.position = startPos;\n        rb.MovePosition(startPos);\n        gameObject.SetActive(true);\n        triggered = false;\n    }\n}\n"},"Assets/Scripts/Obstacles/JumpPad.cs":{"source":"using UnityEngine;\n\npublic class JumpPad : MonoBehaviour\n{\n    public float jumpPower = 15f;\n    public ParticleSystem effect;\n    public float cooldown = 0.25f;\n\n    private float nextTime;\n\n    void OnTriggerEnter(Collider other)\n    {\n        Launch(other);\n    }\n\n    void OnTriggerStay(Collider other)\n    {\n        Launch(other);\n    }\n\n    private void Launch(Collider other)\n    {\n        if (Time.time < nextTime) return;\n        if (!other.CompareTag(\"Player\")) return;\n\n        Rigidbody body = other.GetComponent<Rigidbody>();\n        if (body == null) return;\n\n        nextTime = Time.time + cooldown;\n        Vector3 velocity = body.velocity;\n        velocity.y = jumpPower;\n        body.velocity = velocity;\n\n        AudioManager.Instance.Play(\"jumppad\");\n        if (effect != null)\n        {\n            effect.Emit(32);\n        }\n    }\n}\n"},"Assets/Scripts/Obstacles/Pendulum.cs":{"source":"using UnityEngine;\n\npublic class Pendulum : MonoBehaviour\n{\n    public float swingAngle = 55f;\n    public float swingSpeed = 1.2f;\n    public float phase = 0f;\n\n    private Rigidbody rb;\n\n    void Awake()\n    {\n        rb = GetComponent<Rigidbody>();\n    }\n\n    void FixedUpdate()\n    {\n        float angle = Mathf.Sin(Time.time * swingSpeed + phase) * swingAngle;\n        Quaternion rot = Quaternion.Euler(0f, 0f, angle);\n        if (rb != null)\n        {\n            rb.MoveRotation(rot);\n        }\n        else\n        {\n            transform.rotation = rot;\n        }\n    }\n}\n"},"Assets/Scripts/Items/CollectibleItem.cs":{"source":"using UnityEngine;\n\npublic class CollectibleItem : MonoBehaviour\n{\n    public float rotateSpeed = 90f;\n    public float bobHeight = 0.25f;\n    public float bobSpeed = 2f;\n\n    private Vector3 startPos;\n    private bool collected;\n\n    void Start()\n    {\n        startPos = transform.position;\n    }\n\n    void Update()\n    {\n        transform.Rotate(0f, rotateSpeed * Time.deltaTime, 0f);\n        float y = startPos.y + Mathf.Sin(Time.time * bobSpeed) * bobHeight;\n        transform.position = new Vector3(startPos.x, y, startPos.z);\n    }\n\n    void OnTriggerEnter(Collider other)\n    {\n        if (collected) return;\n        if (!other.CompareTag(\"Player\")) return;\n\n        PlayerCollector collector = other.GetComponent<PlayerCollector>();\n        if (collector == null) return;\n\n        collected = true;\n        collector.Collect(this);\n\n        ParticleSystem ps = GetComponent<ParticleSystem>();\n        if (ps != null)\n        {\n            ps.Emit(18);\n        }\n        gameObject.SetActive(false);\n    }\n}\n"},"Assets/Scripts/Enemy/EnemyController.cs":{"source":"using UnityEngine;\n\npublic enum EnemyState { Patrol, Chase, Return }\n\npublic class EnemyController : MonoBehaviour\n{\n    [Header(\"Patrol\")]\n    public Transform[] patrolPoints;\n    public float patrolSpeed = 2f;\n\n    [Header(\"Chase\")]\n    public float chaseSpeed = 4f;\n    public float detectionDistance = 8f;\n    public float attackDistance = 1.2f;\n    public int damage = 1;\n    public float leashDistance = 14f;\n    public Transform target;\n\n    private EnemyState state = EnemyState.Patrol;\n    private int patrolIndex;\n    private Rigidbody rb;\n    private Vector3 homePos;\n    private float nextDamageTime;\n\n    void Awake()\n    {\n        rb = GetComponent<Rigidbody>();\n        homePos = transform.position;\n    }\n\n    void Start()\n    {\n        if (target == null)\n        {\n            GameObject player = GameObject.FindWithTag(\"Player\");\n            if (player != null) target = player.transform;\n        }\n    }\n\n    void FixedUpdate()\n    {\n        if (GameManager.Instance != null && !GameManager.Instance.IsPlaying()) return;\n\n        float dt = Time.fixedDeltaTime;\n        Vector3 pos = transform.position;\n\n        float distToPlayer = 99999f;\n        if (target != null)\n        {\n            distToPlayer = Vector3.Distance(pos, target.position);\n        }\n        float distFromHome = Vector3.Distance(pos, homePos);\n\n        if (state == EnemyState.Patrol)\n        {\n            if (distToPlayer < detectionDistance)\n            {\n                state = EnemyState.Chase;\n                AudioManager.Instance.Play(\"enemy_alert\");\n            }\n            else\n            {\n                PatrolMove(dt);\n            }\n        }\n        else if (state == EnemyState.Chase)\n        {\n            if (distToPlayer > detectionDistance * 1.6f || distFromHome > leashDistance)\n            {\n                state = EnemyState.Return;\n            }\n            else\n            {\n                ChaseMove(dt);\n            }\n        }\n        else\n        {\n            if (distToPlayer < detectionDistance && distFromHome < leashDistance * 0.8f)\n            {\n                state = EnemyState.Chase;\n            }\n            else\n            {\n                ReturnMove(dt);\n            }\n        }\n    }\n\n    private void PatrolMove(float dt)\n    {\n        if (patrolPoints == null || patrolPoints.Length == 0) return;\n        Transform wp = patrolPoints[patrolIndex];\n        if (wp == null) return;\n        Vector3 targetPos = new Vector3(wp.position.x, transform.position.y, wp.position.z);\n        MoveTowardsPoint(targetPos, patrolSpeed, dt);\n        if (Vector3.Distance(transform.position, targetPos) < 0.25f)\n        {\n            patrolIndex = (patrolIndex + 1) % patrolPoints.Length;\n        }\n    }\n\n    private void ChaseMove(float dt)\n    {\n        if (target == null) return;\n        Vector3 targetPos = new Vector3(target.position.x, transform.position.y, target.position.z);\n        if (Vector3.Distance(transform.position, targetPos) > attackDistance * 0.7f)\n        {\n            MoveTowardsPoint(targetPos, chaseSpeed, dt);\n        }\n    }\n\n    private void ReturnMove(float dt)\n    {\n        Vector3 targetPos = new Vector3(homePos.x, transform.position.y, homePos.z);\n        MoveTowardsPoint(targetPos, patrolSpeed * 1.2f, dt);\n        if (Vector3.Distance(transform.position, targetPos) < 0.3f)\n        {\n            state = EnemyState.Patrol;\n        }\n    }\n\n    private void MoveTowardsPoint(Vector3 targetPos, float speed, float dt)\n    {\n        Vector3 next = Vector3.MoveTowards(transform.position, targetPos, speed * dt);\n        rb.MovePosition(next);\n        Vector3 dir = targetPos - transform.position;\n        dir.y = 0f;\n        if (dir.sqrMagnitude > 0.002f)\n        {\n            Quaternion look = Quaternion.LookRotation(dir.normalized);\n            rb.MoveRotation(Quaternion.Slerp(transform.rotation, look, 10f * dt));\n        }\n    }\n\n    void OnTriggerStay(Collider other)\n    {\n        if (!other.CompareTag(\"Player\")) return;\n        if (Time.time < nextDamageTime) return;\n        PlayerHealth health = other.GetComponent<PlayerHealth>();\n        if (health == null) return;\n        nextDamageTime = Time.time + 1.2f;\n        health.TakeDamage(damage);\n    }\n\n    public EnemyState GetState()\n    {\n        return state;\n    }\n}\n"},"Assets/Scripts/Managers/GameManager.cs":{"source":"using UnityEngine;\n\npublic enum GameState { Playing, Paused, GameOver, Cleared }\n\npublic class GameManager : MonoBehaviour\n{\n    public static GameManager Instance;\n\n    [Header(\"Rules\")]\n    public float timeLimit = 180f;\n    public int totalCrystals = 5;\n\n    [Header(\"References\")]\n    public PlayerHealth player;\n    public UIManager ui;\n\n    private GameState state = GameState.Playing;\n    private float remainingTime;\n    private int crystals;\n    private int damageTaken;\n    private Vector3 checkpoint;\n\n    void Awake()\n    {\n        Instance = this;\n        remainingTime = timeLimit;\n    }\n\n    void Start()\n    {\n        if (player != null)\n        {\n            checkpoint = player.transform.position;\n        }\n        CollectibleItem[] found = FindObjectsOfType<CollectibleItem>();\n        if (found.Length > 0)\n        {\n            totalCrystals = found.Length;\n        }\n        if (ui != null)\n        {\n            ui.UpdateCrystals(0, totalCrystals);\n            ui.UpdateTimer(remainingTime);\n            if (player != null) ui.UpdateLives(player.GetLives());\n        }\n        Debug.Log(\"Webity Cube Adventure started. Crystals in stage: \" + totalCrystals);\n    }\n\n    void Update()\n    {\n        if (Input.GetKeyDown(KeyCode.Escape))\n        {\n            if (state == GameState.Playing || state == GameState.Paused)\n            {\n                TogglePause();\n            }\n        }\n\n        if (state != GameState.Playing) return;\n\n        remainingTime = remainingTime - Time.deltaTime;\n        if (ui != null) ui.UpdateTimer(remainingTime);\n        if (remainingTime <= 0f)\n        {\n            remainingTime = 0f;\n            GameOver(\"TIME UP\");\n        }\n    }\n\n    public bool IsPlaying()\n    {\n        return state == GameState.Playing;\n    }\n\n    public void OnCrystalCollected(int count)\n    {\n        crystals = count;\n        if (ui != null) ui.UpdateCrystals(crystals, totalCrystals);\n    }\n\n    public void OnPlayerDamaged(int livesLeft)\n    {\n        damageTaken = damageTaken + 1;\n        if (ui != null) ui.UpdateLives(livesLeft);\n    }\n\n    public void OnPlayerFell()\n    {\n        if (state != GameState.Playing) return;\n        AudioManager.Instance.Play(\"fall\");\n        if (player != null)\n        {\n            player.TakeDamage(1);\n            if (state == GameState.Playing)\n            {\n                player.Respawn(checkpoint);\n            }\n        }\n    }\n\n    public void SetCheckpoint(Vector3 position)\n    {\n        checkpoint = position + Vector3.up * 1f;\n        if (ui != null) ui.ShowMessage(\"CHECKPOINT!\");\n    }\n\n    public void ReachGoal()\n    {\n        if (state != GameState.Playing) return;\n        if (crystals < totalCrystals)\n        {\n            if (ui != null)\n            {\n                ui.ShowMessage(\"クリスタルが足りません \" + crystals + \" / \" + totalCrystals);\n            }\n            return;\n        }\n        state = GameState.Cleared;\n        float clearTime = timeLimit - remainingTime;\n        AudioManager.Instance.Play(\"goal\");\n        AudioManager.Instance.StopBgm();\n        if (ui != null)\n        {\n            ui.ShowClear(clearTime, crystals, totalCrystals, damageTaken, ComputeRank(clearTime));\n        }\n    }\n\n    private string ComputeRank(float clearTime)\n    {\n        if (damageTaken == 0 && clearTime < 95f) return \"S\";\n        if (damageTaken <= 1 && clearTime < 130f) return \"A\";\n        if (clearTime < 160f) return \"B\";\n        return \"C\";\n    }\n\n    public void GameOver(string reason)\n    {\n        if (state == GameState.GameOver || state == GameState.Cleared) return;\n        state = GameState.GameOver;\n        Debug.Log(\"Game over: \" + reason);\n        AudioManager.Instance.Play(\"gameover\");\n        AudioManager.Instance.StopBgm();\n        if (ui != null) ui.ShowGameOver();\n    }\n\n    public void TogglePause()\n    {\n        if (state == GameState.Playing)\n        {\n            state = GameState.Paused;\n            Time.timeScale = 0f;\n            if (ui != null) ui.ShowPause(true);\n        }\n        else if (state == GameState.Paused)\n        {\n            state = GameState.Playing;\n            Time.timeScale = 1f;\n            if (ui != null) ui.ShowPause(false);\n        }\n    }\n\n    public void RestartGame()\n    {\n        Time.timeScale = 1f;\n        SceneManager.LoadScene(\"MainGame\");\n    }\n\n    public void OnResumeButton() { if (state == GameState.Paused) TogglePause(); }\n    public void OnRestartButton() { RestartGame(); }\n    public void OnRetryButton() { RestartGame(); }\n    public void OnNextButton()\n    {\n        if (ui != null) ui.ShowMessage(\"Thanks for playing! (NEXT stage is up to you...)\");\n    }\n    public void OnSettingsButton() { if (ui != null) ui.ToggleSettings(); }\n    public void OnQuitButton()\n    {\n        if (ui != null) ui.ShowMessage(\"Press the Stop button in the editor to quit Play Mode\");\n        Application.Quit();\n    }\n}\n"},"Assets/Scripts/Managers/AudioManager.cs":{"source":"using UnityEngine;\n\npublic class AudioManager : MonoBehaviour\n{\n    public static AudioManager Instance;\n\n    [Header(\"Sources\")]\n    public AudioSource sfxSource;\n    public AudioSource bgmSource;\n\n    [Header(\"Clips\")]\n    public AudioClip jumpClip;\n    public AudioClip doubleJumpClip;\n    public AudioClip landClip;\n    public AudioClip collectClip;\n    public AudioClip damageClip;\n    public AudioClip fallClip;\n    public AudioClip jumpPadClip;\n    public AudioClip checkpointClip;\n    public AudioClip goalClip;\n    public AudioClip gameOverClip;\n    public AudioClip clickClip;\n    public AudioClip alertClip;\n    public AudioClip fallingFloorClip;\n\n    void Awake()\n    {\n        Instance = this;\n    }\n\n    public void Play(string id)\n    {\n        if (sfxSource == null) return;\n        AudioClip clip = null;\n        switch (id)\n        {\n            case \"jump\": clip = jumpClip; break;\n            case \"doublejump\": clip = doubleJumpClip; break;\n            case \"land\": clip = landClip; break;\n            case \"collect\": clip = collectClip; break;\n            case \"damage\": clip = damageClip; break;\n            case \"fall\": clip = fallClip; break;\n            case \"jumppad\": clip = jumpPadClip; break;\n            case \"checkpoint\": clip = checkpointClip; break;\n            case \"goal\": clip = goalClip; break;\n            case \"gameover\": clip = gameOverClip; break;\n            case \"click\": clip = clickClip; break;\n            case \"enemy_alert\": clip = alertClip; break;\n            case \"falling_floor\": clip = fallingFloorClip; break;\n        }\n        if (clip != null)\n        {\n            sfxSource.PlayOneShot(clip);\n        }\n    }\n\n    public void StopBgm()\n    {\n        if (bgmSource != null) bgmSource.Stop();\n    }\n\n    public void OnBgmUp() { AdjustBgm(0.1f); }\n    public void OnBgmDown() { AdjustBgm(-0.1f); }\n    public void OnSfxUp() { AdjustSfx(0.1f); }\n    public void OnSfxDown() { AdjustSfx(-0.1f); }\n\n    private void AdjustBgm(float delta)\n    {\n        if (bgmSource == null) return;\n        bgmSource.volume = Mathf.Clamp01(bgmSource.volume + delta);\n    }\n\n    private void AdjustSfx(float delta)\n    {\n        if (sfxSource == null) return;\n        sfxSource.volume = Mathf.Clamp01(sfxSource.volume + delta);\n        Play(\"click\");\n    }\n}\n"},"Assets/Scripts/Managers/UIManager.cs":{"source":"using UnityEngine;\nusing UnityEngine.UI;\n\npublic class UIManager : MonoBehaviour\n{\n    [Header(\"HUD\")]\n    public Text crystalText;\n    public Text timerText;\n    public Text lifeText;\n    public Text messageText;\n\n    [Header(\"Panels\")]\n    public GameObject pausePanel;\n    public GameObject gameOverPanel;\n    public GameObject clearPanel;\n    public GameObject settingsPanel;\n    public Text clearStatsText;\n\n    public void UpdateCrystals(int current, int total)\n    {\n        if (crystalText != null)\n        {\n            crystalText.text = \"CRYSTAL  \" + current + \" / \" + total;\n        }\n    }\n\n    public void UpdateTimer(float seconds)\n    {\n        if (timerText == null) return;\n        if (seconds < 0f) seconds = 0f;\n        int m = Mathf.FloorToInt(seconds / 60f);\n        int s = Mathf.FloorToInt(seconds % 60f);\n        timerText.text = \"TIME     \" + m.ToString(\"00\") + \":\" + s.ToString(\"00\");\n    }\n\n    public void UpdateLives(int lives)\n    {\n        if (lifeText == null) return;\n        string hearts = \"\";\n        for (int i = 0; i < lives; i++)\n        {\n            hearts = hearts + \"\\u25cf \";\n        }\n        if (lives <= 0) hearts = \"-\";\n        lifeText.text = \"LIFE     \" + hearts;\n    }\n\n    public void ShowMessage(string msg)\n    {\n        if (messageText == null) return;\n        messageText.text = msg;\n        messageText.gameObject.SetActive(true);\n        CancelInvoke(\"HideMessage\");\n        Invoke(\"HideMessage\", 2.5f);\n    }\n\n    public void HideMessage()\n    {\n        if (messageText != null) messageText.gameObject.SetActive(false);\n    }\n\n    public void ShowPause(bool show)\n    {\n        if (pausePanel != null) pausePanel.SetActive(show);\n        if (!show && settingsPanel != null) settingsPanel.SetActive(false);\n    }\n\n    public void ToggleSettings()\n    {\n        if (settingsPanel != null) settingsPanel.SetActive(!settingsPanel.activeSelf);\n    }\n\n    public void ShowGameOver()\n    {\n        if (gameOverPanel != null) gameOverPanel.SetActive(true);\n    }\n\n    public void ShowClear(float time, int crystals, int total, int damage, string rank)\n    {\n        if (clearPanel != null) clearPanel.SetActive(true);\n        if (clearStatsText != null)\n        {\n            int m = Mathf.FloorToInt(time / 60f);\n            int s = Mathf.FloorToInt(time % 60f);\n            clearStatsText.text =\n                \"TIME       \" + m.ToString(\"00\") + \":\" + s.ToString(\"00\") +\n                \"\\nCRYSTAL    \" + crystals + \" / \" + total +\n                \"\\nDAMAGE     \" + damage +\n                \"\\nRANK       \" + rank;\n        }\n    }\n}\n"},"Assets/Scripts/Ma <script>

  (function() {
    var overlay = document.getElementById("boot-overlay");
    var started = false;
    function loadAssets(project) {
      WAssets.reset();
      WAssets.loadMaterials(project.materials || {});
      Object.entries(project.audioClips || {}).forEach(function(e){ WAssets.defineAudioClip(e[0], e[1]); });
      Object.entries(project.textures || {}).forEach(function(e){ WAssets.defineTexture(e[0], e[1].tex || e[1]); });
      Object.entries(project.prefabs || {}).forEach(function(e){ WAssets.definePrefab(e[0], e[1]); });
      Object.entries(project.scripts || {}).forEach(function(e){ WAssets.defineScript(e[0], e[1].source); });
    }
    function start() {
      if (started) return;
      started = true;
      var project = window.__WEBITY_PROJECT__;
      var canvas = document.getElementById("game-canvas");
      WRenderer.init(canvas);
      CSApi.ctx.log = function(level, msg) {
        (level === "error" ? console.error : level === "warn" ? console.warn : console.log)("[Webity] " + msg);
      };
      loadAssets(project);
      var result = CSCompiler.compileAll(WAssets.scripts);
      if (!result.ok) {
        console.error("Script compilation failed", result.errors);
        overlay.innerHTML = "<h1>Compile Error</h1><p>" + (result.errors[0] ? result.errors[0].message : "") + "</p>";
        return;
      }
      var sceneJson = project.scenes[project.activeScene];
      WRuntime.start(sceneJson);
      WUI.mount(document.getElementById("game-ui-root"));
      WUI.setButtonHandler(function(c) { WRuntime.handleUIButton(c); });
      WInput.setCapture(true);
      overlay.style.opacity = "0";
      setTimeout(function() { overlay.style.display = "none"; }, 450);
      var last = performance.now();
      function frame(now) {
        var dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        WInput.newFrame(dt);
        WRuntime.tick(dt);
        var scene = WRuntime.scene;
        if (scene) {
          CSApi.ctx.gameViewSize = { w: canvas.clientWidth, h: canvas.clientHeight };
          WRenderer.beginFrame();
          var drawList = WRender.buildDrawList(scene);
          var env = WRender.envParams(scene);
          if (env.shadows) {
            var sf = WRender.shadowFocus(drawList);
            WRenderer.renderShadowPass(drawList, new Vector3(env.lightDir[0], env.lightDir[1], env.lightDir[2]), sf.focus, sf.extent);
          }
          var cam = WRender.mainCamera(scene);
          if (cam) {
            var rect = { x: 0, y: 0, w: canvas.clientWidth, h: canvas.clientHeight };
            WRenderer.renderView({
              rect: rect,
              camera: WRender.cameraParams(cam, rect.w / Math.max(1, rect.h)),
              drawList: drawList, env: env,
              particles: WParticles.buildBatches(scene),
              post: WRender.postParams(scene),
            });
          }
          WUI.render(scene, true);
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
    overlay.addEventListener("click", start);
    overlay.addEventListener("keydown", start);
    window.addEventListener("keydown", function once() { start(); window.removeEventListener("keydown", once); });
  })();
  
</script>
